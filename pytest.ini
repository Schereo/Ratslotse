[pytest]
# Nur die Ablagen FEHLGESCHLAGENER Tests behalten (10/2026). Vorgabe ist
# "all" für die letzten drei Läufe — und einige Messtests kopieren die echte
# Rats-Datenbank (~250 MB) je Parametrisierung nach tmp_path
# (test_geld_*::test_bausteingroesse_an_echten_zahlen,
# test_fakten_rat_faelle::test_seiten_kennungen_loesen_auf). Ein einziger
# Lauf ließ so 1–5 GB in $TMPDIR/pytest-of-*/ liegen, drei Läufe das Dreifache
# — am 05.10.2026 Teil eines vollen Datenträgers (ENOSPC). Wer die Ablage
# eines grünen Tests braucht: -o tmp_path_retention_policy=all.
tmp_path_retention_policy = failed
