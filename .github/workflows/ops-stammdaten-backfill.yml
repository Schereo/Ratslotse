# Manuell auslösbarer Ops-Lauf: holt auf dem Server die Beratungsfolge aller
# eingelesenen Vorlagen (vo0053) und die Personen-/Gremien-Stammdaten
# (Mandatsträger aller Wahlperioden + Mitgliedschaften) nach. Reines
# Netz-Parsing, kein LLM. Nutzt denselben Deploy-Key/ProxyJump wie deploy.yml —
# praktisch, wenn lokal kein SSH-Zugang verfügbar ist. Feste Befehle; nur
# Collaborator können triggern.
#
# schritt=besetzung holt nur die aktuelle Besetzung von Rat und Ausschüssen
# (council/committee_seats.py, ~70 Abrufe, gut eine Minute) — die Grundlage
# des Mehrheitsrechners in den Werkzeugen. Auf dev gibt es keinen Wochenlauf,
# der sie füllt; dort ist das der Weg.
name: "Ops: Stammdaten-Backfill"

on:
  workflow_dispatch:
    inputs:
      umgebung:
        description: "Welche VM? (prod = ratslotse.de)"
        type: choice
        options: [prod, dev]
        default: prod
      schritt:
        description: "alles = Stammdaten + Beratungsfolge (bis 2 h), besetzung = nur die Gremienbesetzung"
        type: choice
        options: [alles, besetzung]
        default: alles

concurrency:
  group: ops-stammdaten-backfill-${{ inputs.umgebung }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: "Stammdaten (${{ inputs.umgebung }}, ${{ inputs.schritt }})"
        env:
          SCHRITT: ${{ inputs.schritt }}
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ inputs.umgebung == 'dev' && secrets.VPS_DEV_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          proxy_host: ${{ secrets.VPS_PROXY_HOST }}
          proxy_username: ${{ secrets.VPS_PROXY_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_port: ${{ secrets.VPS_SSH_PORT }}
          # Erstlauf: ~5.000 Beratungsfolge-Seiten + ~300 Personen-Abrufe.
          command_timeout: 120m
          # Eingabe über `envs`, nicht als `${{ … }}` im Skripttext.
          envs: SCHRITT
          script: |
            set -e
            cd ~/app
            if [ "$SCHRITT" = "besetzung" ]; then
              .venv/bin/python scripts/backfill_stammdaten.py --nur-besetzung
              exit 0
            fi
            .venv/bin/python scripts/backfill_stammdaten.py
            .venv/bin/python scripts/backfill_beratungen.py
            .venv/bin/python - <<'PY'
            from council.store import CouncilStore
            s = CouncilStore("data/council.sqlite")
            print("Stand:", s.stammdaten_stats())
            s.close()
            PY
