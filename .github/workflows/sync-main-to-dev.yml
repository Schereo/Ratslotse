# Produktion darf nie dauerhaft Commits enthalten, die im Integrationsbranch
# fehlen. Jeder Push auf main wird deshalb als normaler Merge nach dev
# zurückgeführt. Ein Konflikt überschreibt nichts: Der Job wird rot und macht
# die notwendige manuelle Auflösung sichtbar.
name: Sync production back to dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-main-to-dev
  cancel-in-progress: false

jobs:
  merge-main-into-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Produktionsstand nach dev zurückführen
        id: sync
        run: |
          set -e
          git fetch origin main dev

          if git merge-base --is-ancestor origin/main origin/dev; then
            echo "dev enthält den vollständigen Produktionsstand bereits."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B dev origin/dev
          git merge --no-edit origin/main
          git push origin HEAD:dev
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes mit dem GITHUB_TOKEN lösen absichtlich keine weiteren
      # Workflows aus. Ohne den expliziten Dispatch wäre der Branch aktuell,
      # dev.ratslotse.de bliebe aber auf dem vorherigen Stand stehen.
      - name: Aktualisierten Dev-Stand deployen
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-dev.yml --ref dev
