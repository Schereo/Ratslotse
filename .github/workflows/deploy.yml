name: Deploy to VPS

on:
  pull_request:
    types: [closed]
    branches: [main]
  # Notausgang: Am 26.08.2026 fiel während einer GitHub-Actions-Störung das
  # `closed`-Ereignis zweier gemergter PRs ersatzlos aus — `main` trug den
  # neuen Stand, Prod nicht, und einen Lauf, den es nie gab, kann man nicht
  # neu starten. Seitdem lässt sich der Deploy in der Actions-UI von Hand
  # anstoßen (Ref wählen, „Run workflow"); der Test-Job läuft dabei
  # unverändert davor.
  workflow_dispatch:

# Deploys müssen sich strikt abwechseln. Zwei kurz hintereinander gemergte PRs
# starteten sonst zwei Läufe, die gleichzeitig `npm ci` auf demselben Server
# ausführen — und das leert node_modules zu Beginn. Der zweite Lauf zog dem
# ersten so die Abhängigkeiten unter dem laufenden Build weg; zurück blieben
# 25 von 602 Paketen ohne `next`, und ratslotse.de lieferte 502
# (24.07.2026, zwei Merges im Abstand von 17 Sekunden).
# cancel-in-progress bewusst FALSE: Ein halb durchgelaufener Deploy ist genau
# der Zustand, den wir vermeiden wollen — lieber warten.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Sicherheitsnetz vor dem Deploy: derselbe Testlauf wie in test.yml, hier als
  # harte Abhängigkeit. Ein roter Lauf blockiert den Deploy — ein direkt (ohne
  # grünen PR-Check) gemergter Stand kann Produktion nicht mehr erreichen.
  # (Lehre aus dem #154-Ausfall: roter CI wurde gemergt und deployt.)
  test:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # -c constraints.txt: dieselben Fassungen wie auf Prod. Ohne das
          # prüfte die CI gegen die jeweils neueste — und damit gegen etwas
          # anderes, als die Seite trägt (gemessen 02.09.2026: fastapi 0.137
          # auf Prod, 0.139 auf dev, in der CI wieder etwas Drittes).
          pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: Run tests
        run: python -m pytest tests/ -q

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build docs site
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: npm ci + build (docs-site)
        working-directory: docs-site
        run: |
          npm ci
          npm run build

      - name: Configure deployment SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' \
            'Host edge' \
            "  HostName ${{ secrets.VPS_PROXY_HOST }}" \
            "  User ${{ secrets.VPS_USER }}" \
            "  Port ${{ secrets.VPS_SSH_PORT }}" \
            '  IdentityFile ~/.ssh/id_ed25519' \
            '  StrictHostKeyChecking no' \
            'Host target' \
            "  HostName ${{ secrets.VPS_HOST }}" \
            "  User ${{ secrets.VPS_USER }}" \
            "  Port ${{ secrets.VPS_SSH_PORT }}" \
            '  IdentityFile ~/.ssh/id_ed25519' \
            '  ProxyJump edge' \
            '  StrictHostKeyChecking no' \
            > ~/.ssh/config
          chmod 600 ~/.ssh/config

      # Erste Rückfalllinie noch VOR jeder Codeübertragung. Der finale Snapshot
      # folgt nach dem Build bei gestopptem API-Dienst direkt an der
      # Migrationsgrenze. Hier läuft absichtlich der bisher installierte,
      # bereits geprüfte backup_db.py; der direkte main()-Aufruf umgeht nur den
      # job_runs-Nachtrag, der sonst selbst den Account-Store öffnen würde.
      # BACKUP_ENV=0 kopiert keine Secrets, BACKUP_RSYNC_TARGET= hält den
      # Release unabhängig vom Off-Site-Ziel.
      - name: Create and verify pre-transfer rollback baseline
        run: |
          ssh target '
            set -eu
            cd ~/app
            mkdir -p data/backups
            marker=data/backups/.predeploy-start
            touch "$marker"
            BACKUP_ENV=0 BACKUP_RSYNC_TARGET= \
              .venv/bin/python -c "from scripts.backup_db import main; main()"
            .venv/bin/python - --root . --newer-than "$marker"
            rm -f "$marker"
          ' < scripts/verify_predeploy_backup.py

      # Reine Leseprüfung der Produktionsvoraussetzungen. Sie installiert
      # nichts, schreibt keine .env und fasst die Crontab nicht an. Modellzugriff
      # und der echte HLS-Stream bleiben externe Canaries; hier werden die lokal
      # sicher prüfbaren Voraussetzungen vor rsync fail-closed validiert.
      - name: Verify release runtime prerequisites
        run: |
          ssh target '
            set -eu
            cd ~/app
            .venv/bin/python - --root . --minimum-app-build 19
          ' < scripts/verify_release_runtime.py

      # Der Marker liegt in data/ (vom rsync ausgeschlossen) und muss VOR dem
      # ersten neuen Python-Modul existieren. Der laufende alte API-Prozess
      # darf bis zum fertigen Build weiterarbeiten; ein während rsync neu
      # gestarteter Cron wird entweder vom neuen Store-Guard blockiert oder
      # später als noch laufender Altprozess erkannt. Ein vorhandener Marker
      # stammt aus einem nicht abgeschlossenen Cutover und ist ein harter
      # manueller Recovery-Fall, kein Anlass zum Überschreiben.
      - name: Enter release maintenance barrier
        run: |
          ssh target '
            set -eu
            cd ~/app
            wartung=data/.release-maintenance
            if ! (set -o noclobber; printf "%s\n" "${{ github.sha }}" > "$wartung") 2>/dev/null; then
              echo "BLOCKIERT: $wartung existiert bereits; vorherigen Cutover zuerst prüfen."
              exit 1
            fi
          '

      - name: Deploy via rsync
        run: |
          # '.env.local' braucht eine eigene Ausnahme: Der Name ist nicht '.env',
          # und ohne sie löscht --delete eine auf dem Server angelegte
          # web/frontend/.env.local beim nächsten Deploy wieder weg.
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude 'data/' \
            --exclude '.venv/' \
            --exclude '.git/' \
            --exclude 'web/frontend/node_modules/' \
            --exclude 'web/frontend/.next/' \
            --exclude 'web/frontend/.next-dev/' \
            --exclude 'web/frontend/public/docs/' \
            --exclude 'docs-site/node_modules/' \
            --exclude 'docs-site/dist/' \
            -e "ssh" \
            ./ target:~/app/

          # Statische Doku nach public/docs des Frontends — Next.js liefert sie
          # unter ratslotse.de/docs aus (Rewrites in next.config.mjs), die Edge
          # braucht dafür keine Konfiguration. Eigenes Verzeichnis -> --delete ok.
          rsync -az --delete \
            -e "ssh" \
            docs-site/dist/ target:~/app/web/frontend/public/docs/

      - name: Restart services and rebuild web
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          proxy_host: ${{ secrets.VPS_PROXY_HOST }}
          proxy_username: ${{ secrets.VPS_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -e
            cd ~/app
            # Backend deps (idempotent) + frontend build, then restart web services.
            .venv/bin/pip install -q -r requirements.txt -r web/backend/requirements.txt \
              -c constraints.txt
            cd web/frontend && npm ci --no-audit --no-fund
            # CARTO_API_KEY: Key für die Kartenkacheln, zur Build-Zeit ins
            # Client-Bundle einkompiliert (NEXT_PUBLIC_, s. lib/basemap.ts).
            # Fehlt das Secret, baut der Build trotzdem durch — die Karten
            # tragen dann nur wieder CARTOs „API KEY REQUIRED"-Wasserzeichen.
            NEXT_PUBLIC_CARTO_API_KEY="${{ secrets.CARTO_API_KEY }}" npm run build
            cd ~/app

            # Ab hier darf kein alter Prozess mehr schreiben: Neue Store-
            # Instanzen respektieren den Marker, der API-Dienst wird gestoppt,
            # und der Prozess-Scan fängt noch laufende Cron-/Ops-Prozesse ab,
            # die bereits den vorherigen Code geladen hatten. Bei jedem Fehler
            # bleiben Marker und API-Stopp bewusst bestehen; ein manueller
            # Start könnte sonst ungeprüfte Vorwärtsmigrationen auslösen.
            wartung=data/.release-maintenance
            if [ ! -f "$wartung" ] || [ "$(cat "$wartung")" != "${{ github.sha }}" ]; then
              echo "BLOCKIERT: $wartung fehlt oder gehört nicht zu diesem Commit."
              exit 1
            fi
            cutover_aktiv=1
            trap 'if [ "$cutover_aktiv" = 1 ]; then echo "BLOCKIERT: Wartungsbarriere bleibt aktiv; API wird nicht automatisch gestartet."; fi' EXIT
            sudo /bin/systemctl stop nwz-web-api
            .venv/bin/python scripts/verify_release_runtime.py \
              --root . --minimum-app-build 19 --require-quiescent \
              --quiescent-timeout 120

            # Ein Cutover-Befehl sperrt beide autoritativen Datenbanken gegen
            # Writes, erstellt eindeutige rotationsfreie Snapshots samt
            # SHA-/Schema-/Tabellenmanifest und führt danach beide
            # Migrationsstapel explizit aus. Erst nach dem Post-Migration-
            # quick_check wird die Wartungsbarriere aufgehoben.
            snapshot_label="deploy_${{ github.sha }}_$(date -u +%Y%m%dT%H%M%SZ)"
            RATSLOTSE_RELEASE_MAINTENANCE=1 \
              .venv/bin/python scripts/prepare_release_databases.py \
              --root . --snapshot-label "$snapshot_label"
            rm -f "$wartung"
            cutover_aktiv=0
            trap - EXIT
            sudo /bin/systemctl start nwz-web-api
            sudo /bin/systemctl restart nwz-web-frontend

            # Erst wenn beide Dienste wirklich antworten, gilt der Deploy als
            # geglückt. Ohne diese Prüfung meldete der Lauf „success", während
            # ratslotse.de längst 502 lieferte (nwz-web-frontend hing in einer
            # Neustart-Schleife, `next: not found`) — der Ausfall fiel erst
            # dadurch auf, dass sich jemand nicht anmelden konnte.
            for i in $(seq 1 30); do
              sleep 2
              if curl -sf -o /dev/null http://127.0.0.1:3000/ \
                 && curl -sf -o /dev/null http://127.0.0.1:8000/api/health; then
                echo "Dienste antworten nach $((i * 2))s."
                bereit=1
                break
              fi
            done
            if [ -z "$bereit" ]; then
              echo "FEHLER: Dienste antworten 60s nach dem Neustart nicht."
              systemctl is-active nwz-web-api nwz-web-frontend || true
              journalctl -u nwz-web-frontend -n 30 --no-pager || true
              exit 1
            fi

            # „Der Prozess läuft" ist nicht „er tut das Richtige": `health`
            # fasst die Datenbank nicht an, eine Abfrage auf eine Spalte, die
            # eine Migration gerade entfernt hat, wirft aber erst beim ersten
            # echten Aufruf. Die Rauchprobe ruft die Endpunkte ohne Konto auf
            # und hält jede Antwort gegen den Vertrag, der neben dem Code auf
            # demselben Server liegt. Sie braucht kein Fremdpaket.
            python3 ~/app/scripts/rauchprobe.py --basis http://127.0.0.1:8000
