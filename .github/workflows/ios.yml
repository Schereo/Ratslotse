name: iOS

# `api/openapi.json` steht bewusst in den Pfaden: Die App liest ihre Felder aus
# handgeschriebenen `CodingKeys`, und eine Umbenennung im BACKEND erreichte sie
# auf keinem Weg — dieser Workflow lief nur bei Änderungen unter `ios/`. Genau
# so blieb `hits_30d` stehen, nachdem das Feld `hits_6m` hieß: Die App zeigte
# unter jedem Thema eine 0, bis es jemandem auffiel.
on:
  pull_request:
    paths:
      - 'ios/**'
      - 'api/openapi.json'
      - '.github/workflows/ios.yml'
  push:
    branches: [main, dev]
    paths:
      - 'ios/**'
      - 'api/openapi.json'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: API package tests
        working-directory: ios/Packages/RatslotseAPI
        run: swift test
      - name: Build native app
        working-directory: ios
        run: >-
          xcodebuild -project Ratslotse.xcodeproj -scheme Ratslotse
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
      - name: Test native app
        working-directory: ios
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable == true and (.name | startswith("iPhone")))] | first | .udid // empty')"
          test -n "$DEVICE_ID"
          xcodebuild -project Ratslotse.xcodeproj -scheme Ratslotse \
            -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO test
