name: iOS

# `api/openapi.json` steht bewusst in den Pfaden: Die App liest ihre Felder aus
# handgeschriebenen `CodingKeys`, und eine Umbenennung im BACKEND erreichte sie
# auf keinem Weg — dieser Workflow lief nur bei Änderungen unter `ios/`. Genau
# so blieb `hits_30d` stehen, nachdem das Feld `hits_6m` hieß: Die App zeigte
# unter jedem Thema eine 0, bis es jemandem auffiel.
on:
  pull_request:
    paths:
      - 'ios/**'
      - 'api/openapi.json'
      - '.github/workflows/ios.yml'
  push:
    branches: [main, dev]
    paths:
      - 'ios/**'
      - 'api/openapi.json'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: API package tests
        working-directory: ios/Packages/RatslotseAPI
        run: swift test
      # EINMAL bauen, dann testen. Bis 09/2026 standen hier ein `build` auf
      # `generic/platform=iOS Simulator` und danach ein `test` auf ein
      # konkretes Gerät — zwei verschiedene Ziele, also zwei vollständige
      # Übersetzungen derselben App. Gemessen: 112 s + 180 s.
      #
      # `build-for-testing` / `test-without-building` auf DEMSELBEN Ziel baut
      # einmal und testet ohne Neubau. Die Trennung in zwei Schritte bleibt
      # damit erhalten, und sie ist der Grund, warum es sie gibt: Ein
      # Übersetzungsfehler steht im ersten Schritt, ein gescheiterter Test im
      # zweiten — vermischt sagt ein rotes „test" nicht, welches von beidem
      # kaputt ist.
      - name: Simulator wählen
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable == true and (.name | startswith("iPhone")))] | first | .udid // empty')"
          test -n "$DEVICE_ID"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Build native app
        working-directory: ios
        run: >-
          xcodebuild -project Ratslotse.xcodeproj -scheme Ratslotse
          -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID"
          CODE_SIGNING_ALLOWED=NO build-for-testing

      - name: Test native app
        working-directory: ios
        run: >-
          xcodebuild -project Ratslotse.xcodeproj -scheme Ratslotse
          -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID"
          CODE_SIGNING_ALLOWED=NO test-without-building

  # Die Icons der App liegen als abgelegte Vektoren im Asset-Katalog, nicht als
  # Bibliothek. Ob eine Datei DA ist, prüft `tests/test_ios_icons.py`; ob sie
  # das ganze Zeichen zeigt, sieht nur der Vergleich mit lucide-react — bis
  # 09/2026 fehlte `LucideBellDot` der Glockenkörper, und auf dem Knopf
  # „Vorgang folgen" schwebte ein Punkt über einem Strich.
  #
  # Eigener Ubuntu-Job statt eines Schritts im Build oben: Der läuft auf
  # macOS-Minuten (Faktor 10), und für einen Node-Vergleich ist kein Xcode
  # nötig.
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
        working-directory: web/frontend
      - name: Icons gegen lucide-react halten
        run: node ios/scripts/generate-lucide-icons.mjs --pruefen
