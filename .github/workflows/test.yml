name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # -c constraints.txt: dieselben Fassungen wie auf Prod. Ohne das
          # prüfte die CI gegen die jeweils neueste — und damit gegen etwas
          # anderes, als die Seite trägt (gemessen 02.09.2026: fastapi 0.137
          # auf Prod, 0.139 auf dev, in der CI wieder etwas Drittes).
          pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      # Eigener Schritt vor den Tests: Der Befund soll oben im Log stehen und
      # nicht zwischen 600 Testergebnissen. Läuft trotzdem zusätzlich als Test
      # (tests/test_lint_adressen.py), damit er lokal beim normalen pytest
      # mitgeht.
      - name: Fremde E-Mail-Adressen?
        run: python scripts/lint_adressen.py

      # Aus demselben Grund ein eigener Schritt: Ein ungenutzter Import oder
      # ein undefinierter Name soll oben im Log stehen, nicht hinter 1.500
      # Testergebnissen. Es läuft NUR die Fehlerklasse „F" — warum, steht in
      # `ruff.toml`. Kein Stil, keine Zeilenlänge; ein roter Lauf hier heißt,
      # dass im Code etwas steht, das niemand benutzt oder das es nicht gibt.
      - name: Python-Linter (ruff, nur Fehler)
        run: ruff check .

      # Ebenfalls ein eigener Schritt, ebenfalls damit der Befund oben im Log
      # steht. Was er prüft und warum der Geltungsbereich klein ist, steht in
      # `pyrightconfig.json`. Er kostet unter zwei Sekunden.
      - name: Python-Typen (pyright)
        run: pyright --pythonpath "$(which python)"

      # Der Rest des Bestands: nicht im harten Gate, aber auch nicht
      # ungeprüft. Die Zahl der Befunde je Bereich darf nur SINKEN. Steht hier
      # direkt hinter dem Schritt darüber, weil die Node-Laufzeit dann schon
      # warm ist — als pytest-Test hat dieselbe Arbeit den Testlauf von drei
      # auf elf Minuten verlängert.
      - name: Typ-Schuldenstand
        run: python scripts/pruefe_typschulden.py

      # `-n auto` verteilt den Lauf über pytest-xdist auf alle Kerne des
      # Runners: aus knapp drei Minuten wird rund eine. Bis 09/2026 ging das
      # nicht, und der Grund war keine Eigenschaft der Tests selbst, sondern
      # eine Verabredung über eine Prozessvariable: Jedes Backend-Testmodul
      # setzte seine Wegwerf-Datenbank per `os.environ.setdefault("COUNCIL_DB",
      # …)` beim Import. Welche Datei galt, hing damit an der
      # Import-Reihenfolge — seriell fest, auf vier Prozesse verteilt je Worker
      # eine andere. `tests/conftest.py` setzt die Pfade jetzt einmal je
      # Prozess; wer die Variablen wieder in einem Testmodul setzt, macht den
      # Lauf hier sporadisch rot.
      - name: Run tests
        run: python -m pytest tests/ -q -n auto
