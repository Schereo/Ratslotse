# Manuell auslösbarer Ops-Lauf: „gilt als behandelt" im Bestand auf das eigene
# Ergebnis `settled` umstellen (`scripts/fix_settled_outcomes.py`) und danach die
# Kurzfassungen der umgestellten Punkte neu schreiben
# (`scripts/fix_outcome_summaries.py`).
#
# ANLASS (30.09.2026). Die amtliche Formel stand auf vier verschiedenen
# Ergebnissen; „Frag den Rat" gab den Vorschlag als Auftrag wieder (Datensatz
# 19018, Schlossplatz-Spielplatz). Die Einordnung beim Einlesen macht
# `council.votes.normalize_outcome`; dieser Lauf zieht den Bestand nach.
#
# Vorgabe ist BERICHT: Jede Änderung steht als Zeile im Log (id, alt → neu, Satz)
# — wer zurückdrehen will, hat die Liste. `schreiben` stellt die Ergebnisse um
# und zieht die Kurzfassungen nach (Modellkosten im Log; wenige Cent). Ein
# zweiter Lauf findet nichts mehr.
name: "Ops: Gilt als behandelt (settled)"

on:
  workflow_dispatch:
    inputs:
      umgebung:
        description: "Welche VM? (prod = ratslotse.de)"
        type: choice
        options: [dev, prod]
        default: dev
      modus:
        description: "bericht = nur zeigen, schreiben = umstellen + Kurzfassungen neu"
        type: choice
        options: [bericht, schreiben]
        default: bericht

concurrency:
  group: ops-settled-ergebnis-${{ inputs.umgebung }}
  cancel-in-progress: false

jobs:
  settled:
    runs-on: ubuntu-latest
    steps:
      - name: "settled (${{ inputs.umgebung }}, ${{ inputs.modus }})"
        env:
          MODUS: ${{ inputs.modus }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ inputs.umgebung == 'prod' && secrets.VPS_HOST || secrets.VPS_DEV_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          proxy_host: ${{ secrets.VPS_PROXY_HOST }}
          proxy_username: ${{ secrets.VPS_PROXY_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_port: ${{ secrets.VPS_SSH_PORT }}
          command_timeout: 60m
          envs: MODUS
          script: |
            set -e
            cd ~/app
            PY=.venv/bin/python
            if [ "$MODUS" = "schreiben" ]; then
              $PY scripts/fix_settled_outcomes.py --schreiben
              $PY scripts/fix_outcome_summaries.py --schreiben
            else
              $PY scripts/fix_settled_outcomes.py
              $PY scripts/fix_outcome_summaries.py
            fi
