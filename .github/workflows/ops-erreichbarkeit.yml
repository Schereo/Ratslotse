# Prüft von AUSSERHALB der Maschine, ob ratslotse.de antwortet.
#
# Die Lücke, die das schließt, stand bis heute als Absatz in
# `scripts/check_herzschlag.py`: „Stirbt der Cron-Dienst als GANZES, stirbt
# dieser Lauf mit. Dafür bräuchte es eine Prüfung von außerhalb der Maschine —
# ein Anpinger auf /api/health etwa. Der ist hier bewusst nicht gebaut: Er
# gehört nicht ins Repo, sondern auf einen zweiten Rechner."
#
# Der zweite Rechner ist der GitHub-Runner. Er steht nicht auf dem VPS, teilt
# weder Platte noch Cron noch Netz mit ihm — und er kostet nichts extra.
#
# Am 07.09.2026 lag die API 74 Minuten still (abgebrochener Deploy, die
# fail-closed Wartungsbarriere blieb stehen). Nichts hat es gemeldet: Ein
# Cron-Alarm setzt einen laufenden Cron voraus, `kern/fehler.py` einen
# laufenden Prozess, und ein roter Actions-Lauf ist kein Alarm, sondern ein
# Eintrag in einer Liste. Gemerkt wurde es, als eine Anmeldung 500 lieferte.
name: Ops – Erreichbarkeit (Prod)

on:
  schedule:
    # Alle zehn Minuten. GitHub hält den Takt nur ungefähr ein und schiebt ihn
    # unter Last auch mal um Minuten — das ist in Ordnung: Dies ist das
    # Auffangnetz, kein Messgerät. Wer eine Zusage auf die Minute braucht,
    # nimmt einen bezahlten Dienst.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Für den Blick auf den vorherigen Lauf: Während eines Ausfalls soll nicht
  # alle zehn Minuten eine Mail kommen.
  actions: read

concurrency:
  group: ops-erreichbarkeit
  cancel-in-progress: false

jobs:
  probe:
    # Nicht in Forks: Dort fehlen die Secrets, und ein fremder Fork soll nicht
    # im Zehnminutentakt gegen ratslotse.de laufen.
    if: github.repository == 'Schereo/Ratslotse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prod anpingen
        id: probe
        run: |
          set -u
          BASIS="https://ratslotse.de"
          # Diese drei fasst der Reverse-Proxy, das Frontend und das Backend
          # an — zusammen sagen sie, welche Schicht steht. /api/health ist die
          # wichtigste: Sie ist genau der Endpunkt, den die Wartungsbarriere
          # auf 503 zieht.
          PFADE="/ /api/health /api/app-config"
          # Dreimal, mit Pause. Ein einzelner Aussetzer ist Netz, kein
          # Ausfall — und ein falscher Alarm um drei Uhr nachts kostet mehr
          # Vertrauen, als er wert ist.
          for versuch in 1 2 3; do
            KAPUTT=""
            for p in $PFADE; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASIS$p" || echo 000)
              echo "Versuch $versuch: $p -> $code"
              case "$code" in
                2*|3*) ;;
                *) KAPUTT="$KAPUTT $p:$code" ;;
              esac
            done
            if [ -z "$KAPUTT" ]; then
              echo "Alles erreichbar (Versuch $versuch)."
              exit 0
            fi
            [ "$versuch" -lt 3 ] && sleep 20
          done
          echo "befund=$KAPUTT" >> "$GITHUB_OUTPUT"
          echo "NICHT ERREICHBAR:$KAPUTT"
          exit 1

      # Nur beim ERSTEN Fehlschlag melden. Ein Ausfall dauert selten zehn
      # Minuten; ohne diese Bremse stünden am Ende zwölf gleiche Mails im
      # Postfach und die dreizehnte läse niemand mehr. Dieselbe Regel wie in
      # `kern/fehler.py`: Die erste Begegnung meldet sich, der Rest wird
      # gezählt. Der rote Lauf bleibt jedes Mal stehen.
      - name: Erster Fehlschlag?
        id: erster
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          vorher=$(gh run list --workflow ops-erreichbarkeit.yml --status completed \
                     --limit 1 --json conclusion -q '.[0].conclusion' 2>/dev/null || echo "")
          echo "Vorheriger Lauf: ${vorher:-keiner}"
          if [ "$vorher" = "failure" ]; then
            echo "melden=0" >> "$GITHUB_OUTPUT"
          else
            echo "melden=1" >> "$GITHUB_OUTPUT"
          fi

      # WEG 1 — die Mail über den SERVER. Dort liegen RESEND_API_KEY und
      # ALERT_EMAIL längst in der .env; es braucht also kein neues Secret,
      # nur den Deploy-Schlüssel, den dieses Repo ohnehin hat.
      #
      # Das deckt den häufigsten Fall vollständig ab, und es ist genau der von
      # heute: Die Maschine läuft, nur die API nicht (Barriere steht, Dienst
      # gestoppt, Build kaputt). Bleibt die Maschine als Ganzes stumm, greift
      # Weg 2.
      - name: Alarm über den Server
        id: ueber_server
        if: failure() && steps.erster.outputs.melden == '1'
        continue-on-error: true
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' \
            'Host edge' \
            "  HostName ${{ secrets.VPS_PROXY_HOST }}" \
            "  User ${{ secrets.VPS_USER }}" \
            "  Port ${{ secrets.VPS_SSH_PORT }}" \
            '  IdentityFile ~/.ssh/id_ed25519' \
            '  StrictHostKeyChecking no' \
            'Host target' \
            "  HostName ${{ secrets.VPS_HOST }}" \
            "  User ${{ secrets.VPS_USER }}" \
            "  Port ${{ secrets.VPS_SSH_PORT }}" \
            '  IdentityFile ~/.ssh/id_ed25519' \
            '  ProxyJump edge' \
            '  StrictHostKeyChecking no' \
            > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh -o ConnectTimeout=20 target 'cd ~/app && .venv/bin/python - --root . \
            --betreff "Ratslotse – ratslotse.de ist nicht erreichbar" \
            --zustand \
            --text "Der Anpinger von ausserhalb erreicht ratslotse.de nicht. Betroffen:${{ steps.probe.outputs.befund }}

          Dreimal im Abstand von 20 Sekunden geprueft, alle drei Male erfolglos.

          Lauf: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"' \
            < scripts/alarm.py

      # WEG 2 — der Notausgang, wenn die MASCHINE nicht antwortet. Dann ist der
      # Weg über den Server versperrt, und es braucht einen Absender außerhalb.
      # Dafür (und nur dafür) sind die beiden optionalen Repository-Secrets da.
      # Fehlen sie, bleibt GitHubs eigene Benachrichtigung zum roten Lauf.
      - name: Alarm am Server vorbei
        if: failure() && steps.erster.outputs.melden == '1' && steps.ueber_server.outcome != 'success'
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          set -u
          if [ -z "${RESEND_API_KEY:-}" ] || [ -z "${ALERT_EMAIL:-}" ]; then
            echo "Der Server war nicht erreichbar, und die optionalen Secrets"
            echo "RESEND_API_KEY/ALERT_EMAIL fehlen im Repository."
            echo "Es bleibt GitHubs eigene Benachrichtigung zum roten Lauf."
            exit 0
          fi
          lauf="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          text="ratslotse.de antwortet nicht, UND der Server ist per SSH nicht erreichbar.
          Das deutet auf die Maschine oder das Netz, nicht auf die Anwendung.

          Betroffen:${{ steps.probe.outputs.befund }}

          Lauf: $lauf"
          jq -n --arg to "$ALERT_EMAIL" --arg text "$text" \
            '{from:"Ratslotse <noreply@ratslotse.de>", to:[$to],
              subject:"Ratslotse – Server nicht erreichbar", text:$text}' \
          | curl -sS -X POST https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              --data @- -o /dev/null -w 'Resend: %{http_code}\n'
