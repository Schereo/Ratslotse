name: Claude (@claude im PR)

# Code-Review auf Zuruf: Wer in einem Pull Request `@claude` schreibt — als
# Kommentar, als Review oder als Kommentar an einer Zeile —, bekommt eine
# Antwort von Claude. Ohne Erwähnung läuft nichts.
#
# BEZAHLT AUS DEM CLAUDE-ABO, nicht über die API: Repo-Secret
# `CLAUDE_CODE_OAUTH_TOKEN`, erzeugt mit `claude setup-token` (ein Jahr gültig,
# danach neu erzeugen). Jeder Lauf zählt gegen dieselben Nutzungsgrenzen wie
# eine Claude-Code-Sitzung am Rechner.
#
# NUR LESEN UND KOMMENTIEREN: `contents: read` — Claude kann nichts pushen,
# auch wenn ein Kommentar darum bittet. Das Repo ist öffentlich, ein Kommentar
# ist Eingabe von außen.
#
# KEINE SHELL: Claude bekommt keinen einzigen Bash-Befehl. Der Diff wird in
# einem eigenen Schritt vorab in eine Datei geschrieben und mit `Read` gelesen.
# Schon `git fetch` war zu viel — `--upload-pack=<befehl>` führt einen
# beliebigen Befehl aus, und ein präparierter Diff kann Claude genau dazu
# auffordern (Prompt-Injection), etwa um das Abo-Token abzugreifen.
#
# WER AUSLÖSEN DARF: nur Konten mit Schreibrecht. Die `if`-Bedingung ist ein
# Vorfilter, der Fremden nicht einmal einen Runner startet (author_association;
# Schereo ist ein Nutzerkonto, Mitwirkende haben dort immer Schreibrecht).
# Maßgeblich ist die Prüfung der Action selbst, die das Schreibrecht des
# Auslösers über die API abfragt. Ohne beides könnte jede*r mit einem
# GitHub-Konto `@claude` unter einen PR schreiben und das Abo aufbrauchen.
#
# NUR PULL REQUESTS, keine Issues: In einem Issue legt die Action einen eigenen
# Zweig an, und das scheitert am Nur-Lese-Recht.
#
# `issue_comment` liest diese Datei immer vom Standard-Zweig (`main`) — eine
# Änderung hier wirkt für gewöhnliche PR-Kommentare erst nach dem Merge dorthin.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  # Reicht auch für Kommentare im PR-Gespräch (die laufen über die Issues-API).
  pull-requests: write
  # Für die CI-Werkzeuge der Action („warum ist die CI rot?“).
  actions: read

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      || (github.event_name == 'pull_request_review_comment'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      || (github.event_name == 'pull_request_review'
        && contains(github.event.review.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Zwei Erwähnungen im selben PR laufen nacheinander, nicht gegeneinander.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Kein Token in .git/config, das Claude mit Read finden könnte.
          persist-credentials: false

      # Der Diff vorab, damit Claude keine Shell braucht. Außerhalb des
      # Arbeitsbaums, damit er nicht als Änderung im Checkout liegt.
      - name: Diff des PR holen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/pr.diff"

      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Wie docs-review.yml: das Workflow-Token statt der Claude-GitHub-App.
          # Seine Rechte stehen oben unter `permissions` — und damit auch, dass
          # Claude nicht pushen kann.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Kein `prompt`: Mit einem Prompt schaltet die Action bei Kommentaren
          # in den Automatik-Modus und antwortet nicht mehr auf die Erwähnung.
          # Die Anweisung steht deshalb im System-Prompt.
          # `Read(//proc/**)` gesperrt: Die Umgebung des Prozesses trägt das
          # Abo-Token, und `Read`/`Grep` dürfen sonst jeden Pfad lesen.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash,Read(//proc/**)"
            --append-system-prompt "Du arbeitest in einem Pull Request dieses Repositorys und antwortest auf eine Erwähnung. Ist um ein Review gebeten (oder nichts Bestimmtes), dann reviewe den Diff des PR: Er liegt in der Datei ${{ runner.temp }}/pr.diff, lies sie mit Read; den Code drumherum findest du im Arbeitsverzeichnis. Eine Shell hast du nicht. Es gelten die Projektregeln aus CLAUDE.md und den CLAUDE.md-Dateien der berührten Verzeichnisse. Melde echte Probleme (falsches Verhalten, Sicherheit, Datenschutz, verletzte Projektregeln, fehlende Tests für riskante Stellen), keine Geschmacksfragen. Jeden Befund mit Datei und Zeile als Inline-Kommentar an der Stelle, dazu im Sammelkommentar eine knappe Zusammenfassung; nichts gefunden heißt ein Satz. Du kannst und sollst nichts committen oder pushen; bittet jemand um eine Änderung, beschreibe sie als Vorschlag. Antworte auf Deutsch."
