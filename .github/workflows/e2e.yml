name: Browsertests

# Die Browser-Suite prüft, was keine andere Prüfung sieht: dass die Seiten im
# Browser wirklich erscheinen und die Wege durch sie funktionieren — Anmelden,
# Themen anlegen und löschen, eine Tagesordnung aufklappen, eine Frage stellen,
# eine Antwort bewerten.
#
# WARUM SIE BIS 09/2026 NICHT LIEF. Sie war da, aber 16 von 35 Prüfungen waren
# rot — nicht wegen fehlender Daten, sondern weil sie eine Oberfläche
# erwarteten, die es nicht mehr gab: Kacheln, die durch „Die Woche im Rat"
# ersetzt sind, einen Dialog für die Tagesordnung, die inzwischen in der Karte
# aufklappt, eine Überschrift „Ratsinformationssystem", die heute „Sitzungen"
# heißt. Eine rote Suite ist kein Gate, sondern Hintergrundrauschen; deshalb
# stand sie in keiner CI. Jetzt ist sie grün und darf blockieren.
#
# OHNE DATENABZUG. In der CI gibt es den lokalen Abzug nicht — die Ratsdaten
# sind leer. Die Suite ist daraufhin geprüft (36/36 auch mit leerem Bestand):
# Was Daten braucht, mockt seinen Endpunkt.

on:
  pull_request:
    paths:
      - 'web/frontend/**'
      - 'web/backend/**'
      - 'council/**'
      - 'kern/**'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
    paths:
      - 'web/frontend/**'
      - 'web/backend/**'
      - '.github/workflows/e2e.yml'

jobs:
  browser:
    runs-on: ubuntu-latest

    # AUFGETEILT AUF ACHT LÄUFER, NACH DAUER VERTEILT (11/2026).
    #
    # Die Wartezeit eines Pull Requests ist der LANGSAMSTE Teil dieser Suite —
    # alle anderen Prüfungen sind früher fertig. Deshalb zählt hier nicht die
    # Rechenzeit, sondern wie lang der längste Läufer braucht.
    #
    # Die Geschichte in drei Zahlen:
    #
    #     bis 09/2026   ein Läufer                       16–21 min
    #     09/2026       vier, `--shard=i/4`               7,6 min (140 Tests)
    #     22.11.2026    dieselben vier, 419 Tests        10,6 min
    #
    # Die Suite hat sich seit der Vierteilung verdreifacht, und `--shard`
    # schneidet nach Test-ANZAHL in Dateireihenfolge — die Tests sind aber
    # sehr ungleich teuer (2,1 s je Test in `16-tippspiel`, 7,0 s in
    # `27-plaene`). Gemessen am 22.11.2026, reine Testzeit je Teil:
    #
    #     Teil 1  8,5 min      Teil 3  6,3 min
    #     Teil 2  7,5 min      Teil 4  9,8 min   ← darauf wartete jeder PR
    #
    # Zwei Änderungen, beide in `tests/shard-specs.mjs`:
    #
    #  * **Nach Dauer statt nach Anzahl.** Die Dateien werden nach ihrer in
    #    der CI gemessenen Laufzeit verteilt (`tests/e2e-durations.json`).
    #    Schon bei vier Teilen wären es damit 7,5–7,6 statt 6,3–9,8 Minuten.
    #  * **Acht statt vier.** Mit denselben Zahlen gerechnet: je Teil 3,7–3,9
    #    Minuten reine Testzeit. Dazu kommt je Läufer eine knappe Minute
    #    Rüstzeit (venv, npm ci, Chromium) und das Übersetzen der Routen.
    #
    # „Vier, nicht acht" stand hier bis 11/2026, mit der Begründung, mehr
    # Teile verschöben die Zahl nur langsam: Bei 140 Tests und 2,3 Minuten im
    # längsten Teil fraß die Rüstzeit den Gewinn. Bei 30 Minuten Testzeit
    # stimmt die Rechnung nicht mehr.
    #
    # Warum die Aufteilung gefahrlos ist, obwohl die Tests ausdrücklich
    # seriell laufen (`workers: 1`): Jeder Läufer startet über
    # `tests/start-backend.sh` sein EIGENES Backend auf einer eigenen
    # Wegwerf-Datenbank (`mktemp -d`). Die Läufer teilen also nichts. Und eine
    # DATEI bleibt die kleinste Einheit — die Reihenfolge innerhalb einer
    # Datei bleibt erhalten.
    #
    # Kein Weg über die Datei-Reihenfolge hinweg: `loginAdmin` in
    # `helpers.ts` registriert sein Konto selbst und verträgt die 409, wenn es
    # schon da ist. Genau deshalb darf Datei 09 auch ohne Datei 01 laufen.
    #
    # ES KOSTET MEHR RECHENZEIT, ALS ES SPART — und das ist Absicht. Der
    # Aufschlag kommt vom Next-Entwicklungsserver: Jeder Teil übersetzt die
    # Routen, die SEINE Tests aufrufen, von vorn, und die Routen überschneiden
    # sich zwischen den Teilen (bei vier Teilen zusammen rund drei Minuten).
    #
    # Gekauft wird damit nicht Rechenzeit, sondern WARTEZEIT. Dass das ein
    # guter Tausch ist, liegt daran, dass dieses Repo öffentlich ist: GitHub
    # rechnet Actions-Minuten für öffentliche Repos nicht ab. In einem
    # privaten Repo wäre dieselbe Änderung eine Rechnung.
    #
    # Die Liste zählt lückenlos ab 1 — NUR sie legt fest, wie viele Teile es
    # gibt: Name und Aufruf nehmen die Gesamtzahl aus `strategy.job-total`.
    # Eine Lücke oder ein doppelter Eintrag ließe einen Teil der Suite still
    # aus; `tests/test_ci_shards.py` hält die Liste deshalb fest.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    name: Browsertests (${{ matrix.shard }}/${{ strategy.job-total }})

    # Die Grenze ist kein Ziel, sondern der Notausgang für einen hängenden
    # Lauf — sie gilt für EINEN Teil, nicht für die ganze Suite.
    #
    # 20 Minuten, obwohl ein Teil nur rund fünf braucht: Derselbe
    # Läufer schwankt stark. Die Python-Suite, die sonst gut drei Minuten
    # läuft, brauchte an einem Tag zwölf — ohne dass sich etwas am Code
    # geändert hätte. Eine knapp gesetzte Grenze macht daraus eine
    # ZEITÜBERSCHREITUNG, also einen roten PR mit einer Meldung, die nicht
    # sagt, was kaputt ist. Der Notausgang darf großzügig sein.
    #
    # Die Anmeldung, die hier bis 11/2026 als „nächster Hebel" stand, ist
    # längst umgebaut: `auth.setup.ts` meldet jede Identität einmal je Lauf
    # an, die Specs starten über `storageState` angemeldet
    # (`tests/e2e/konten.ts`).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      # Das venv liegt im Repo-Wurzelverzeichnis — genau dort sucht
      # `tests/start-backend.sh` es zuerst.
      - name: Backend-Umgebung
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt -r web/backend/requirements.txt \
            -c constraints.txt

      - name: Frontend-Abhängigkeiten
        working-directory: web/frontend
        run: npm ci --no-audit --no-fund

      # Nur Chromium: Die Suite fährt ein Projekt (playwright.config.ts), und
      # jeder weitere Browser kostet Minuten, ohne etwas anderes zu prüfen.
      #
      # HIER IST NICHTS ZU ZWISCHENSPEICHERN, und das ist gemessen, nicht
      # vermutet. Der Schritt kostet 20 s und sieht damit wie der lohnendste
      # Kandidat aus — die 22 s pip und 9 s npm daneben liegen ja längst im
      # Cache (`cache: pip` / `cache: npm` oben). Ein `actions/cache` auf
      # `~/.cache/ms-playwright` wurde am 07.09.2026 eingebaut und wieder
      # entfernt:
      #
      #     Lauf 1 (Cache leer)      Browser holen 20 s
      #     Lauf 2 (Cache-TREFFER)   Browser holen 20 s  + 3 s Wiederherstellung
      #
      # Der Treffer stand im Log, der Schritt wurde trotzdem keine Sekunde
      # schneller. Die Zeit steckt nicht im Herunterladen des Browsers,
      # sondern in `--with-deps` — das ist ein `apt-get install` der
      # System-Bibliotheken, und die liegen außerhalb jedes zwischengelegten
      # Verzeichnisses. Der Cache machte den Lauf also um 3 s LANGSAMER und
      # belegte 261 MB.
      #
      # `--with-deps` NUR, WENN CHROMIUM NICHT STARTET (11.11.2026). Bis dahin
      # lief es bei jedem Lauf, mit der Begründung: Fehlt eine Bibliothek,
      # startet der Browser gar nicht erst. Gemessen auf ubuntu-26.04
      # (20261101.186.1): Jede Bibliothek, die Chromium braucht, liegt schon im
      # Image („already the newest version"); `apt` holt nur noch neun
      # Schriftpakete für CJK, Thai und Kyrillisch nach. Die Suite vergleicht
      # keine Bilder (`page.screenshot` schreibt nur Dateien für den Bericht),
      # die Schriften ändern am Ergebnis also nichts.
      #
      # Der Download war trotzdem ein Gate: Am 11.11.2026 lösten die Läufer
      # `archive.ubuntu.com` und `security.ubuntu.com` nicht auf, `apt-get`
      # endete mit 100, und jeder PR mit Frontend- oder Backend-Änderung war
      # rot — zweimal hintereinander, bei Tests, die nie gelaufen sind.
      #
      # Die Startprobe hält die alte Absicherung: Fehlt dem Image eines Tages
      # eine Bibliothek, wirft `launch()` und erst dann läuft `install-deps`.
      - name: Browser holen
        working-directory: web/frontend
        run: |
          npx playwright install chromium
          if ! node -e "require('@playwright/test').chromium.launch().then(b => b.close()).catch(e => { console.error(e.message); process.exit(1); })"; then
            echo "Chromium startet nicht — System-Bibliotheken nachinstallieren."
            npx playwright install-deps chromium
          fi

      # Welche Dateien dieser Läufer fährt, sagt `tests/shard-specs.mjs`. Ein
      # leerer Teil bricht dort ab, statt durchzugehen: `playwright test` ohne
      # Dateien führe die GANZE Suite — auf jedem leeren Läufer noch einmal.
      # (`bash -e` beendet den Schritt, wenn die Zuweisung scheitert.)
      - name: Browsertests
        working-directory: web/frontend
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          SPECS=$(node tests/shard-specs.mjs "$SHARD" "$SHARDS")
          echo "Teil $SHARD/$SHARDS: $SPECS"
          npx playwright test $SPECS

      # Bei Rot: der HTML-Bericht mit Screenshot, Video und Trace jedes
      # gescheiterten Laufs. Ohne ihn steht in der CI nur „Timeout", und die
      # Suche beginnt bei null.
      #
      # Der Name trägt die Teilnummer: Namensgleiche Artefakte aus einer
      # Matrix weist `upload-artifact@v4` mit einem Fehler ab (in v3 hätten
      # sie sich gegenseitig überschrieben, was schlimmer wäre — man lädt den
      # Bericht herunter und sucht den Fehler in den Tests eines anderen
      # Teils).
      - name: Bericht sichern
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-bericht-${{ matrix.shard }}
          path: |
            web/frontend/playwright-report
            web/frontend/test-results
          retention-days: 7
