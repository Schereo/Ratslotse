name: Docs-Review (KI)

# Prüft bei jedem PR, ob Code-Änderungen die Dokumentation veralten lassen, und
# postet Vorschläge als PR-Kommentar. KOMMENTAR-MODUS: Die Permissions geben nur
# `contents: read` — die Action kann also NICHTS committen, nur kommentieren.
#
# VORAUSSETZUNG: Repo-Secret `ANTHROPIC_API_KEY` (Settings → Secrets → Actions).
# Ohne das Secret schlägt der Job fehl — dann Secret hinzufügen oder diesen
# Workflow deaktivieren/löschen. Kosten fallen pro Lauf an (ein LLM-Review je PR).
#
# Läuft bewusst nur bei opened/reopened/ready_for_review (nicht bei jedem Push auf
# den PR) — das hält die Kosten niedrig. Für Re-Review bei jedem Push `synchronize`
# zu den types ergänzen.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  docs-review:
    # Keine Forks (Secrets stehen Fork-PRs ohnehin nicht zur Verfügung).
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        id: review
        # Beratender Bot, kein Qualitäts-Gate: Scheitert der Review (z. B.
        # leeres API-Guthaben, 21.07.2026), soll der PR nicht rot werden —
        # es fehlt dann schlicht der Review-Kommentar. Echte Workflow-Defekte
        # fallen dadurch weniger auf (bewusster Trade-off).
        continue-on-error: true
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Fehlerausgabe sichtbar machen (Läufe scheiterten ab 21.07. sofort
          # mit verstecktem Fehler); Diff+Doku passen locker in den Kontext.
          show_full_output: true
          # Pass the default token so the action skips the GitHub-App/OIDC token
          # exchange (we don't install the Claude GitHub App). pull-requests:write
          # above lets it post the review comment.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Du bist Dokumentations-Reviewer für dieses Repository.

            Aufgabe: Prüfe die Änderungen dieses Pull Requests (den Diff gegen den
            Basis-Branch) darauf, ob sie Dokumentation veralten lassen.

            Relevante Doku:
            - Markdown im Repo-Root: README.md, CLAUDE.md, REZEPTE.md, scripts/README.md
            - Die Starlight-Doku unter docs-site/src/content/docs/ — ALLE Seiten
              dort (lies das Verzeichnis, die Liste wächst) samt den ADRs unter adr/.
              Welche Seite ein Feature erklärt, steht je Feature-Schalter in
              kern/features.py (Feld `docs`).

            Was schon maschinell geprüft wird und KEINEN Hinweis von dir braucht
            (tests/test_docs_current.py): genannte Pfade, Symbole, Modelle,
            API-Routen, Umgebungsvariablen samt Vorgabewerten, Cron-Jobs,
            Schritte des Wochenlaufs, MCP-Werkzeuge, Links und die Seitenleiste.
            Die Seiten unter referenz/ sind erzeugt (scripts/docs_reference.py);
            schlage dort nie eine Änderung von Hand vor.

            Achte auf das, was kein Test sieht: ob ein Absatz noch STIMMT.
            Geändertes Verhalten, eine andere Reihenfolge der Schritte, neue
            Grenzen und Schwellen, ein Mechanismus, der anders begründet wird
            als im Text, eine Zahl aus einer Messung, die der PR überholt. Eine
            NEUE folgenreiche Technik-Entscheidung sollte ggf. einen neuen ADR
            bekommen.

            Ausgabe: Poste GENAU EINEN PR-Kommentar.
            - Wenn Anpassungen nötig sind: liste pro betroffener Doku-Stelle den
              Dateipfad und einen konkreten Vorschlag (gerne als Diff-Snippet).
            - Wenn nichts anzupassen ist: ein kurzer Satz, dass die Doku aktuell ist.
            Committe NICHTS — nur kommentieren. Antworte auf Deutsch.

      # Der Review-Schritt darf scheitern, ohne den PR rot zu machen — aber
      # nicht unbemerkt. Am 22.11.2026 fiel auf, dass er mindestens seit dem
      # 12.11. an „Credit balance is too low" endete: Der Lauf war grün, und
      # an keinem PR stand ein Kommentar.
      - name: Review ausgefallen?
        if: ${{ steps.review.outcome == 'failure' }}
        run: echo "::warning title=Docs-Review lief nicht::Der KI-Review ist gescheitert (Guthaben, Schlüssel oder Dienst). Kein Kommentar am PR heißt hier NICHT „Doku ist aktuell“. Gründe stehen im Schritt davor."
