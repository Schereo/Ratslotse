# Dev-Deploy: Jeder Push auf den Branch `dev` deployt auf die Dev-VM
# (dev.ratslotse.de). Seit 08/2026 ist `dev` der INTEGRATIONS-Branch:
# Feature-PRs gehen nach `dev`, Prod bekommt gesammelte Release-PRs
# `dev` -> `main` (Merge-Commit!) und einzelne Fixes direkt nach `main`
# (danach `main` nach `dev` zurückmergen). Kein Force-Push mehr auf `dev` —
# der Branch trägt jetzt gemeinsame Historie.
#
# Die VM holt den Stand weiterhin per fetch + reset --hard (robust gegen
# jede Art von Branch-Umbau); .env/data/.venv/node_modules sind untracked
# und bleiben unberührt. Kein Test-Gate: die Tests laufen ohnehin auf jedem
# PR (test.yml). Prod deployt weiterhin NUR deploy.yml (PR-Merge auf main).
name: Deploy to Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

# Schnell aufeinanderfolgende Pushes: der neueste gewinnt, ältere Läufe
# werden abgebrochen (auf Dev ist nur der letzte Stand interessant).
concurrency:
  group: deploy-dev
  cancel-in-progress: true

# Der Lauf braucht vom Token nur eins: das eigene Repo lesen dürfen. Ohne
# diesen Block gälte die Repo-Vorgabe, und die kann Schreibrechte enthalten.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy auf die Dev-VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Reicht für einen Abruf des eigenen Repos und hebt die Drosselung
          # von „je Adresse" auf „je Token".
          GH_ABRUF_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.VPS_DEV_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          proxy_host: ${{ secrets.VPS_PROXY_HOST }}
          proxy_username: ${{ secrets.VPS_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_port: ${{ secrets.VPS_SSH_PORT }}
          # npm ci + next build auf 2 Kernen kann dauern.
          command_timeout: 30m
          # Der Abruf-Token wandert als UMGEBUNGSVARIABLE hinüber, nicht als
          # Argument: Argumente stehen in der Prozessliste der VM, die
          # Umgebung eines Prozesses nicht.
          envs: GH_ABRUF_TOKEN
          script: |
            set -e
            cd ~/app
            # ANGEMELDET abrufen. Am 02.09.2026 scheiterten sieben
            # Dev-Deploys mit „could not read Username for 'https://github.com'"
            # bzw. „expected flush after ref listing". Das Repo ist öffentlich,
            # der Abruf braucht also keine Anmeldung — aber GitHub drosselt
            # UNANGEMELDETE Abrufe je Adresse, und die VM teilt ihre Adresse
            # mit allem anderen, was von dort abruft. Die Absage kommt als
            # HTTP-Fehler statt als Ref-Liste zurück, und git deutet sie als
            # Frage nach Zugangsdaten.
            #
            # Warten hilft dagegen nicht: Drei Versuche über 45 s sind an
            # derselben Traube gescheitert (Lauf be265de0). Das Fenster der
            # Drosselung ist länger. Angemeldet gilt ein anderes, viel höheres
            # Kontingent — und es zählt je Token statt je Adresse.
            #
            # Der Token steht in der Umgebung und wird über einen
            # credential-Helfer gereicht, nicht in die Adresse geschrieben:
            # Sonst stünde er in `git remote -v` und in jedem Fehlertext.
            export GIT_TERMINAL_PROMPT=0
            if [ -n "$GH_ABRUF_TOKEN" ]; then
              export GIT_ASKPASS=/tmp/ratslotse-askpass
              printf '#!/bin/sh\ncase "$1" in *Username*) echo x-access-token;; *) echo "$GH_ABRUF_TOKEN";; esac\n' \
                > "$GIT_ASKPASS"
              chmod 700 "$GIT_ASKPASS"
              trap 'rm -f /tmp/ratslotse-askpass' EXIT
            fi
            # Die Versuche bleiben als Netz für kurze Netzstörungen.
            for versuch in 1 2 3; do
              if git fetch origin dev; then break; fi
              if [ "$versuch" = 3 ]; then
                echo "Abruf nach drei Versuchen gescheitert." >&2
                exit 1
              fi
              echo "Abruf fehlgeschlagen, neuer Versuch in $((versuch * 15))s"
              sleep $((versuch * 15))
            done
            git reset --hard ${{ github.sha }}
            .venv/bin/pip install -q -r requirements.txt -r web/backend/requirements.txt \
              -c constraints.txt
            cd web/frontend
            npm ci --no-audit --no-fund
            # Umgebungs-Gate: Features, die nur auf dev.ratslotse.de sichtbar
            # sein sollen, prüfen NEXT_PUBLIC_RATSLOTSE_ENV === "dev". Der
            # Prod-Build (deploy.yml) setzt die Variable nicht — dort werden
            # solche Seiten zu 404. Zur Build-Zeit einkompiliert (NEXT_PUBLIC_).
            #
            # CARTO_API_KEY: Key für die Kartenkacheln (lib/basemap.ts). Fehlt
            # das Secret, baut der Build trotzdem durch — die Karten tragen dann
            # nur wieder das „API KEY REQUIRED"-Wasserzeichen von CARTO.
            NEXT_PUBLIC_RATSLOTSE_ENV=dev \
            NEXT_PUBLIC_CARTO_API_KEY="${{ secrets.CARTO_API_KEY }}" \
            npm run build
            sudo systemctl restart nwz-web-api nwz-web-frontend
            sleep 3
            curl -sf -o /dev/null http://127.0.0.1:3000 && echo "Frontend OK"
            curl -sf http://127.0.0.1:8000/api/health && echo " API OK"
            # Dieselbe Rauchprobe wie auf Prod — hier zuerst, damit ein Bruch
            # auffällt, bevor er dorthin fährt.
            python3 ~/app/scripts/rauchprobe.py --basis http://127.0.0.1:8000
