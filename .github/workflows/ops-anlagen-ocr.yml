# Manuell auslösbarer Ops-Lauf: liest die gescannten Anlagen per Sehmodell
# (`scripts/backfill_anlagen_ocr.py`) — den GANZEN Bestand, nicht nur die
# Finanzdokumente.
#
# WARUM ES IHN NEBEN `ops-finanzdaten-ingest.yml` GIBT. Jener Lauf holt mit
# `--nur-finanz` die Dokumente, aus denen der Haushalts-Bereich liest; das ist
# dort die Regel und keine Sparmaßnahme. Dieser hier ist der andere Fall:
# Tim hat am 20.08.2026 entschieden, dass **alles** eingelesen wird — Namen,
# Anschriften und Unterschriften inklusive —, aber nichts davon über „Frag den
# Rat" zurückkommt.
#
# DASS DAS HÄLT, IST KEINE ZUSAGE, SONDERN EIN FILTER. Der Lauf schreibt
# `status='ocr'`, und es gibt genau zwei Wege, auf denen Anlagentext in eine
# Nutzerantwort gerät — beide filtern auf `status='ok'`:
#
#   * `store.anlagen_missing_embeddings()` → `council_anlage_embeddings` →
#     die Gründliche Recherche,
#   * `store.rebuild_fts()`, das Antrags-Anlagen in den Volltextindex der
#     Beschlüsse zieht.
#
# `tests/test_ocr.py` hält beide fest. Wer einen davon auf `'ocr'` erweitert,
# veröffentlicht damit gescannte Förderanträge von Vereinen.
#
# WARUM NUR DEV. Der Lauf zielt bewusst auf `VPS_DEV_HOST` und nicht auf
# `VPS_HOST`. Diese Dokumente liegen im Bürgerinfo zwar öffentlich, aber ihr
# Volltext ist heute nirgends indiziert; ihn auf die Prod-Datenbank zu legen
# ist eine eigene Entscheidung und nicht der Nebeneffekt eines Ops-Laufs —
# dieselbe Überlegung, mit der `ops-finanzdaten-ingest.yml` auf dev bleibt.
name: "Ops: Gescannte Anlagen lesen (dev)"

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Höchstens so viele Anlagen (leer = alle)"
        required: false
        default: ""
      max_seiten:
        description: "Höchstens so viele Seiten je Anlage"
        required: false
        default: "120"

concurrency:
  group: ops-anlagen-ocr
  cancel-in-progress: false

jobs:
  ocr:
    runs-on: ubuntu-latest
    steps:
      - name: OCR auf der Dev-VM
        env:
          OCR_LIMIT: ${{ inputs.limit }}
          OCR_MAX_SEITEN: ${{ inputs.max_seiten }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_DEV_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          proxy_host: ${{ secrets.VPS_PROXY_HOST }}
          proxy_username: ${{ secrets.VPS_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_port: ${{ secrets.VPS_SSH_PORT }}
          # Rund 227 Anlagen à ~7 Seiten, je Seite ein Modellaufruf von ein
          # paar Sekunden. Die 10-Minuten-Vorgabe der Action reicht dafür bei
          # weitem nicht.
          command_timeout: 180m
          # Die Eingaben gehen über `envs` an die Shell und NICHT als
          # `${{ … }}` in den Skripttext. Nur Collaborator können diesen
          # Workflow auslösen, aber ein Wert, der in einer Kommandozeile
          # interpoliert wird, ist eine Kommandozeile — und dieses Repo ist
          # öffentlich. Beide Werte werden unten zusätzlich auf Ziffern
          # geprüft, bevor sie ein Argument werden.
          envs: OCR_LIMIT,OCR_MAX_SEITEN
          script: |
            set -e
            cd ~/app

            if [ -n "$OCR_LIMIT" ] && ! echo "$OCR_LIMIT" | grep -qE '^[0-9]+$'; then
              echo "limit muss eine Zahl sein, war: $OCR_LIMIT"; exit 2
            fi
            if ! echo "$OCR_MAX_SEITEN" | grep -qE '^[0-9]+$'; then
              echo "max_seiten muss eine Zahl sein, war: $OCR_MAX_SEITEN"; exit 2
            fi

            # Der Renderer für Seiten ohne seitenfüllendes Bild — bewusst nicht
            # in requirements.txt (wie fastembed), hier bei Bedarf nachgezogen.
            .venv/bin/python -c "import pypdfium2" 2>/dev/null \
              || .venv/bin/pip install --quiet pypdfium2

            LIMIT=""
            if [ -n "$OCR_LIMIT" ]; then
              LIMIT="--limit $OCR_LIMIT"
            fi

            # Erst zeigen, was drankäme — kostet nichts und steht im Log,
            # falls der eigentliche Lauf später abbricht.
            .venv/bin/python scripts/backfill_anlagen_ocr.py --trocken $LIMIT

            .venv/bin/python scripts/backfill_anlagen_ocr.py \
              $LIMIT --max-seiten "$OCR_MAX_SEITEN"

            .venv/bin/python - <<'PY'
            from council.store import CouncilStore
            s = CouncilStore("data/council.sqlite")
            zahlen = dict(s._conn.execute(
                "SELECT status, COUNT(*) FROM council_anlagen GROUP BY status").fetchall())
            print(f"\nAnlagen nach Status: {zahlen}")

            # Die Zusage, nachgerechnet statt behauptet: Keine Anlage mit
            # OCR-Text darf in den Chunk-Vektoren stehen.
            drin = s._conn.execute(
                "SELECT COUNT(*) FROM council_anlage_embeddings e "
                "JOIN council_anlagen a ON a.document_id = e.document_id "
                "WHERE a.status = 'ocr'").fetchone()[0]
            print(f"OCR-Anlagen in den Chunk-Vektoren: {drin}  "
                  f"({'in Ordnung' if drin == 0 else 'DARF NICHT SEIN'})")
            s.close()
            if drin:
                raise SystemExit(1)
            PY
