# Manuell auslösbarer Ops-Lauf: liest die Finanzdaten des Haushalts-Bereichs
# auf der DEV-VM ein und meldet, was danach im Bestand steht.
#
# WARUM ES IHN GIBT. Der Bereich hält sich selbst aktuell — `check_finanzdaten`
# läuft alle zwei Wochen und holt, was neu dazugekommen ist (`kern/jobs.py`).
# Für einen frisch gebauten Parser ist das aber die falsche Wartezeit: Die
# Seite steht, die Tabelle ist leer, und bis zu vierzehn Tage sieht niemand,
# ob der Parser auf dem echten Bestand trägt. Dieser Lauf schließt genau diese
# Lücke — er ersetzt den Cron nicht, er zieht ihn vor.
#
# WARUM NUR DEV. Der Haushalts-Bereich steht hinterm Umgebungs-Gate
# (`web/frontend/lib/haushalt-frei.ts`) und ist auf ratslotse.de nicht
# sichtbar. Auf Prod sollen seine Tabellen deshalb leer bleiben; dieser
# Workflow zielt bewusst auf `VPS_DEV_HOST` und NICHT auf `VPS_HOST`. Wer ihn
# einmal auf Prod richten will, ändert damit eine Produktentscheidung, nicht
# nur ein Secret.
#
# Der Bestandsschutz in `council/finanzquellen.py` macht den Lauf gefahrlos
# wiederholbar: Eine Quelle, die weniger liest als der gespeicherte Stand,
# überschreibt ihn nicht, sondern meldet es.
name: "Ops: Finanzdaten einlesen (dev)"

on:
  workflow_dispatch:

concurrency:
  group: ops-finanzdaten-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Ingests auf der Dev-VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_DEV_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          proxy_host: ${{ secrets.VPS_PROXY_HOST }}
          proxy_username: ${{ secrets.VPS_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_port: ${{ secrets.VPS_SSH_PORT }}
          # Die Jahresabschlüsse und Teilhaushalts-Pläne sind mehrere hundert
          # Seiten je Jahrgang; der Erstlauf über alle liegt deutlich über der
          # 10-Minuten-Vorgabe der Action.
          command_timeout: 90m
          script: |
            set -e
            cd ~/app

            # Reihenfolge nach Abhängigkeit: erst die Downloads (sie brauchen
            # nichts aus dem Bestand), dann die Dokumente aus dem eigenen
            # Anlagen-Bestand, zuletzt der Städtevergleich.
            #
            # Nicht jede Schicht hat ein eigenes Skript: Die Investitionen
            # hängen an `ingest_finanzen_opendata.py`, der Stellenplan an
            # `ingest_finanzberichte.py`. Wer eine neue Schicht baut, prüft
            # hier, ob sie überhaupt aufgerufen wird — ein Parser ohne Ingest
            # fällt sonst nur dadurch auf, dass die Seite leer bleibt.
            # ERST die Volltexte, DANN die Parser. Auf der Dev-VM standen
            # fünf Tabellen leer, obwohl ihre Parser liefen: Sieben der
            # vierzehn Schichten lesen aus `council_anlagen`, und dort lagen
            # 5.186 Anlagen ohne Text. `--nur-finanz` holt die 293, aus denen
            # der Haushalts-Bereich tatsächlich liest, statt aller 5.500.
            # `--gekappte` holt zusätzlich die Anlagen, die an einer FRÜHEREN
            # MAX_TEXT-Grenze abgeschnitten wurden. Sie stehen auf `ok` und
            # kämen sonst nie wieder an die Reihe — bei 400.000 Zeichen endeten
            # die Jahresabschlüsse mitten im Dokument, vor Abschnitt 8
            # („Anlagen zum Anhang"). Der Schalter darf dauerhaft mitlaufen:
            # Sind die Texte einmal vollständig, ist ihre Länge krumm und der
            # Filter greift nicht mehr.
            # `--glyphen` stellt Anlagen, die VOR der Buchstaben-Schwelle mit
            # Glyphen-Rauschen auf `ok` geladen wurden, auf `empty` — sonst
            # sähe die OCR unten sie nie (Schlussbericht 2024, 295296).
            .venv/bin/python scripts/backfill_anlagen_texte.py --nur-finanz --retry-failed --gekappte --glyphen

            # UND DANN die, die gar keine Textebene haben. Der Lauf oben setzt
            # sie auf `status='empty'`; dieser hier schickt jede Seite als Bild
            # an ein Sehmodell (council/ocr.py). Ohne ihn blieben die
            # Wirtschaftspläne des Abfallwirtschaftsbetriebs 2019–2021 für
            # immer draußen — sie liegen im Ratsinformationssystem nur als
            # Scan.
            #
            # `--nur-finanz` ist hier KEIN Sparzwang, sondern die Regel: Von
            # den 235 Anlagen ohne Textebene sind über die Hälfte Anträge, viele
            # davon Förderanträge von Vereinen mit Namen, Anschriften und
            # Unterschriften. Die haben in einem Finanzdaten-Lauf nichts
            # verloren. Der Lauf schreibt `status='ocr'`, nicht `'ok'` — das
            # hält den Text aus den Chunk-Vektoren und damit aus Antworten der
            # KI-Frage heraus, während die Parser ihn sehen.
            #
            # Kosten: rund 0,0024 $ je Seite, also wenige Euro für den ganzen
            # Finanzbestand. Braucht OPENROUTER_API_KEY (steht in der .env der
            # Dev-VM); fehlt er, bricht der Lauf mit Fehler ab und der Rest
            # läuft weiter — die Ampel unten fängt das auf.
            ocr=0
            # Der Renderer für Seiten OHNE seitenfüllendes Bild. Er steht
            # bewusst nicht in requirements.txt (dieselbe Zurückhaltung wie bei
            # fastembed) und wird hier bei Bedarf nachgezogen — ein Wheel mit
            # gebündeltem pdfium, keine Systemabhängigkeit.
            #
            # OHNE IHN FEHLT GENAU DAS DOKUMENT, UM DAS ES GEHT: Der
            # RPA-Schlussbericht ist born-digital; seine Seiten tragen kein
            # Bild, sondern Vektoren und eine unbrauchbare Textebene. Die
            # AWB-Scans kommen ohne Renderer aus, er nicht.
            .venv/bin/python -c "import pypdfium2" 2>/dev/null \
              || .venv/bin/pip install --quiet pypdfium2

            .venv/bin/python scripts/backfill_anlagen_ocr.py --nur-finanz || ocr=$?

            .venv/bin/python scripts/ingest_haushalt.py
            .venv/bin/python scripts/ingest_finanzen_opendata.py
            .venv/bin/python scripts/ingest_schulden.py
            .venv/bin/python scripts/ingest_finanzberichte.py
            .venv/bin/python scripts/ingest_pruefberichte.py
            .venv/bin/python scripts/ingest_konzernabschluss.py
            .venv/bin/python scripts/ingest_investitionen_ist.py
            .venv/bin/python scripts/check_beteiligungsbericht.py
            .venv/bin/python scripts/ingest_ausgabenreihe.py
            # Nachbewilligungen nach § 117 NKomVG. Steht NACH dem Backfill
            # oben, und das ist keine Kosmetik: Die drei Rechenschaftsberichte
            # (Dokumente 265441, 280862, 295295) liegen mit `status='listed'`
            # und leerem `raw_text` im Bestand. Ohne den Backfill liest dieser
            # Lauf nur die Ratsbeschlüsse — also die Teilmenge ohne den Nenner,
            # zu dem sie gehört. Genau die Halbwahrheit, gegen die der Block
            # gebaut ist.
            .venv/bin/python scripts/ingest_nachbewilligungen.py
            # Die Zuwendungen lesen nicht aus dem Netz, sondern aus dem
            # eigenen Bestand: Beschlusszeilen plus Vorlagen-Volltexte. Ohne
            # den Volltext-Lauf oben gibt es keine Zweitstelle und damit keine
            # einzige Zeile — deshalb steht das hier und nicht weiter oben.
            .venv/bin/python scripts/ingest_spenden.py

            # Die Wirtschaftspläne der Eigenbetriebe (#663). Wie die
            # Zuwendungen darüber liest dieser Lauf nicht aus dem Netz — die
            # Eckwerte stehen im Beschlussvorschlag der Vorlage selbst, also
            # in `council_vorlagen`. Er hängt deshalb NICHT am Volltext-Lauf
            # ganz oben (der füllt `council_anlagen`) und an keiner anderen
            # Zeile dieser Reihe; er steht hier, weil er dieselbe Quelle liest
            # wie sein Vorgänger. Wiederholen ist gefahrlos: Der Schlüssel ist
            # (Betrieb, Jahr), ein zweiter Lauf ersetzt den Stand.
            #
            # Sein Rückgabewert wird AUFGEHOBEN statt sofort zu wirken. Reißt
            # eine Rechenprobe, meldet das Skript Exit 1 — die übrigen
            # Jahrgänge sind dann trotzdem gespeichert, der Riss ist ein
            # Befund und kein Absturz. Unter `set -e` nähme dieser eine Befund
            # den ganzen Rest mit: `archive_statistik.py`, dessen Quelldateien
            # sonst niemand aufhebt, und den Bestandsbericht — ausgerechnet
            # die Diagnose, die man in dem Moment braucht. Zweimal steht in
            # dieser Datei schon, wie ein später Abbruch einen fertigen Lauf
            # entwertet hat (17.08., Exit 2 und „KeyError: slice"). Der Lauf
            # endet trotzdem rot, aber erst ganz unten.
            wirtschaftsplaene=0
            .venv/bin/python scripts/ingest_wirtschaftsplaene.py || wirtschaftsplaene=$?

            # Die Haushaltssatzung — Kreditermächtigung (§ 2), Dispo-Höchstbetrag
            # (§ 4), Verpflichtungsermächtigungen (§ 3) und der Finanzhaushalt
            # als Ganzes (§ 1.2). Steht NACH dem Anlagen-Backfill oben, weil sie
            # aus einer Anlage liest; die neun Satzungs-PDFs lagen bis 08/2026
            # allesamt mit `status='listed'` und leerem Volltext im Bestand.
            #
            # Der Lauf färbt hier direkt rot, anders als der
            # Wirtschaftsplan-Lauf: Ein Riss heißt bei ihm, dass die Satzung
            # ihrer eigenen Summenzeile widerspricht — dann ist entweder das
            # Layout gewechselt oder der Text kaputt, und beides will man
            # sofort sehen und nicht erst hinter dem Bestandsbericht.
            .venv/bin/python scripts/ingest_haushaltssatzung.py

            # Die Gebührenbedarfsberechnung — Abfall und Straßenreinigung.
            # Steht NACH dem OCR-Lauf oben, und das ist keine Sortierlaune:
            # Der Jahrgang 2020 liegt nur als Scan vor und wird erst dort
            # lesbar.
            .venv/bin/python scripts/ingest_gebuehren.py

            # Die Änderungslisten zum Haushalt — was der Entwurf im Verfahren
            # noch geändert wurde, Position für Position, und seit #838 mit
            # dem Urheber je Position, wo das Dokument ihn nennt.
            #
            # ER FEHLTE HIER BIS 08/2026, und das war die eigentliche Falle:
            # Der Lauf musste nach jedem Parser-Merge von Hand auf der Dev-VM
            # angestoßen werden — vergaß man ihn, zeigte dev neuen Code auf
            # altem Bestand, was von außen wie ein kaputter Parser aussieht.
            # Genau der Fall, vor dem der Kommentar ganz oben warnt („ein
            # Parser ohne Ingest fällt sonst nur dadurch auf, dass die Seite
            # leer bleibt") — hier blieb sie nicht einmal leer, sie war falsch.
            #
            # Er hängt an KEINEM der Läufe darüber: Er liest aus
            # `council_anlagen` nur Label und URL und lädt die PDFs selbst aus
            # dem Ratsinformationssystem, braucht also weder den Volltext- noch
            # den OCR-Lauf. Wiederholen ist gefahrlos — gespeichert wird je
            # (Jahrgang, Liste) mit vorherigem Löschen, und was seine Proben
            # nicht besteht, wird gar nicht erst geschrieben.
            #
            # `pymupdf` liefert die Wortkoordinaten, ohne die sich Ertrag,
            # Aufwand und Erläuterung nicht sicher trennen lassen. Es steht
            # bewusst nicht in requirements.txt (dieselbe Zurückhaltung wie bei
            # pypdfium2 oben) und wird hier bei Bedarf nachgezogen.
            .venv/bin/python -c "import pymupdf" 2>/dev/null \
              || .venv/bin/pip install --quiet pymupdf
            .venv/bin/python scripts/ingest_aenderungslisten.py
            # Und dieselben Listen für den FINANZhaushalt — also das, was
            # investiert wird. Eigenes Skript, weil die Bauform eine andere
            # ist (fünf Betragsspalten statt zwei); dieselbe Voraussetzung,
            # deshalb steht es direkt daneben.
            .venv/bin/python scripts/ingest_aenderungslisten_fhh.py

            # Die beiden Steuertabellen des Jahrbuchs (1103 Plan neben Ist je
            # Steuerart, 1105 Hebesätze seit 1980). Sie stehen NACH
            # ingest_finanzen_opendata.py, und das ist keine Sortierlaune:
            # Beide prüfen ihre Jahresbeschriftung gegen `council_steuern` —
            # die Ist-Reihe, die jenes Skript einliest. Läuft dieses hier
            # zuerst, kommt gar nichts herein, und der Lauf sagt auch warum.
            #
            # Es liest außerdem das ARCHIV mit, nicht nur die Live-Datei:
            # Tabelle 1103 führt je Ausgabe nur drei Jahrgänge, und die Stadt
            # hält keine alten Ausgaben online. Deshalb steht es VOR
            # archive_statistik.py — die heutige Sicherung braucht es nicht,
            # die von gestern schon.
            .venv/bin/python scripts/ingest_steuertabellen.py

            # Die dritte Schuldenzahl (Tabellenband der Statistischen Ämter).
            # Steht NACH ingest_finanzberichte.py, und das ist Pflicht, keine
            # Sortierlaune: Der Lauf speichert nur bei bestandener
            # Kernhaushalts-Probe, und die vergleicht gegen die Bilanz, die
            # jenes Skript einliest. Ohne sie bricht er ab — mit Begründung.
            .venv/bin/python scripts/ingest_integrierte_schulden.py

            # Das Archiv läuft ZULETZT und ist kein Ingest: Es schreibt in
            # keine Tabelle, sondern legt die Quelldateien beiseite. Es steht
            # trotzdem hier, weil die Stadt kein Jahrbuch-Archiv führt — nur
            # die neueste Ausgabe liegt online, und Tabellen mit drei
            # Jahrgängen verlieren mit jeder Ausgabe ihr ältestes Jahr. Der
            # tägliche Cron ist der eigentliche Schutz; dieser Aufruf sorgt
            # dafür, dass ein Ops-Lauf ihn nicht überholt.
            .venv/bin/python scripts/archive_statistik.py

            # ingest_staedtevergleich.py läuft hier BEWUSST NICHT mit. Es
            # verlangt drei Datei-URLs als Pflichtargumente (--kfa,
            # --kfa-vorjahr, --realsteuer), und die tragen beim Landesamt für
            # Statistik undurchsichtige Download-Nummern („/download/227086"),
            # die sich nicht vorhersagen lassen — sie stehen nur auf den
            # Übersichtsseiten. Der Lauf brach deshalb am 17.08. mit Exit 2 ab,
            # nachdem alles davor bereits erledigt war.
            #
            # Der Städtevergleich wird von Hand nachgezogen, wenn das Land eine
            # neue Ausgabe veröffentlicht; die Adressen stehen im Kopf des
            # Skripts.

            # Was danach dasteht — und vor allem, ob eine Zeile ohne Herkunft
            # durchgerutscht ist. Das ist die einzige Zahl, die null sein MUSS.
            # Die Tabellennamen sind die englischen seit #918 — mit den alten
            # meldete jede Zeile „no such table“, und der Bericht war blind,
            # ohne den Lauf rot zu färben (Nebenbefund aus dem Haushaltsvollzug-PR).
            .venv/bin/python - <<'PY'
            from council.store import CouncilStore
            s = CouncilStore("data/council.sqlite")
            tabellen = [
                "council_budget", "council_income_budget",
                "council_income_statement", "council_variance_reasons",
                "council_products", "council_audit_reports",
                "council_group_items", "council_group_entities",
                "council_taxes", "council_tax_capacity", "council_einwohner",
                "council_city_comparison", "council_investments",
                "council_staff_plan", "council_debt",
                "council_investment_measures", "council_investments_actual",
                "council_investments_actual_kinds",
                # Seit 08/2026: Finanzrechnung (#600), Bilanz (#602) und die
                # lange Ausgabenreihe seit 1972 (#604). Eine Tabelle, die hier
                # fehlt, fällt nur dadurch auf, dass irgendwann jemand eine
                # leere Seite meldet — genau der Fall, den dieser Bericht
                # verhindern soll.
                "council_cash_flow_statement", "council_balance_sheet",
                "council_balance_sheet_notes", "council_expense_series",
                # Nachbewilligungen (§ 117 NKomVG). Die dritte Tabelle steht
                # hier mit, obwohl ihre Zeilen an den Jahren hängen: Bleibt
                # sie leer, während `..._jahre` gefüllt ist, hat das Kapitel
                # seine vier Entscheidungswege nicht hergegeben — und genau
                # die sind der Inhalt des Blocks.
                "council_supplementary_approvals",
                "council_supplementary_years",
                "council_supplementary_channels",
                # Die Zuwendungen an die Stadt. `council_donations_rejected`
                # steht bewusst mit im Bericht: Die Zeilen ohne Zweitstelle
                # sind Inhalt der Seite, nicht Abfall — verschwänden sie, ohne
                # dass es auffällt, sähe die Reihe vollständiger aus, als sie
                # ist.
                "council_donations", "council_donations_rejected",
                # Die beiden Steuertabellen des Jahrbuchs (#606). Bei
                # `council_tax_plan` sagt die Jahresspanne mehr als die
                # Zeilenzahl: Sie muss über die Zeit WACHSEN, obwohl jede
                # Ausgabe nur drei Jahrgänge führt — sonst liest der Lauf das
                # Archiv nicht mit.
                "council_tax_plan", "council_tax_rates",
                # Bürgschaftsbestand und die dritte Schuldenzahl (#619). Bei
                # `council_integrated_debt` ist EINE Zeile der
                # Sollzustand, nicht ein Mangel: Die Quelle verbietet die
                # Zeitreihe ausdrücklich.
                "council_buergschaften", "council_integrated_debt",
                # Die Wirtschaftspläne der Eigenbetriebe (#663). Die
                # Zeilenzahl ist hier eine echte Aussage und keine Statistik:
                # Gelesen wird nur, was seine Eckwerte im Beschlusstext trägt,
                # und das tut allein der EGH — acht Jahrgänge (2019–2026). Wer
                # hier deutlich weniger sieht, hat entweder keine
                # Vorlagen-Volltexte im Bestand oder einen Parser, dem ein
                # Format entglitten ist.
                "council_fees", "council_fee_rates",
                "council_budget_bylaw",
                "council_business_plans",
                # Die Änderungslisten (#734/#838). Die Summen-Tabelle steht mit
                # dabei, weil sie der Beweis der anderen ist: Positionen ohne
                # ihre Zusammenstellung hätte der Ingest gar nicht gespeichert
                # — bliebe sie leer, während Positionen dastehen, wäre etwas
                # an dieser Ordnung vorbeigelaufen.
                "council_budget_amendments",
                "council_budget_amendments_totals",
                # Dieselben Listen für den Finanzhaushalt. Von den 18
                # Dokumenten lesen sich 15; die Zeilenzahl hier ist deshalb
                # eine Aussage über den Parser, nicht nur über den Bestand.
                "council_budget_amendments_cash",
                "council_budget_amendments_cash_totals",
            ]
            # Die Jahresspalte heißt nicht überall „year": der Stellenplan
            # führt „budget_year", der Gesamtergebnishaushalt „plan_budget_year". Der erste Lauf meldete
            # für beide „no such column" — deshalb wird sie hier aus dem Schema
            # gelesen statt geraten.
            def jahresspalte(tabelle):
                namen = [r[1] for r in s._conn.execute(f"PRAGMA table_info({tabelle})")]
                for kandidat in ("year", "budget_year", "plan_budget_year", "report_year"):
                    if kandidat in namen:
                        return kandidat
                return None

            print("Bestand nach dem Lauf:")
            for t in tabellen:
                try:
                    n = s._conn.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0]
                    spalte = jahresspalte(t)
                    spanne = "—"
                    if spalte and n:
                        von, bis = s._conn.execute(
                            f"SELECT MIN({spalte}), MAX({spalte}) FROM {t}").fetchone()
                        spanne = f"{von}–{bis}" if von else "—"
                    # Eine leere Tabelle ist keine Panne, aber eine Ansage: Die
                    # Seite dazu steht dann ohne Daten da.
                    print(f"  {t:38} {n:>6} Zeilen  {spanne}"
                          + ("   ← LEER" if not n else ""))
                except Exception as e:                      # noqa: BLE001
                    print(f"  {t:38} — {e}")
            # herkunft_luecken() liefert ein dict {Tabelle: Anzahl}, keine
            # Liste — das hat den Lauf am 17.08. mit „KeyError: slice" beendet,
            # nachdem alles Inhaltliche schon erledigt war. Leeres dict heißt:
            # keine Zeile ohne Herkunftsnachweis.
            # Was das Sehmodell gelesen hat — und was noch als Bild liegt.
            # Gezählt wird `ocr_model`, nicht `status='ocr'` — den Status gibt es
            # seit #679 nicht mehr, gelesene Scans stehen auf `ok`.
            # Steht hier, weil ein OCR-Lauf sonst nur im Log auftaucht: Die
            # Zahl der verbleibenden Scans ist die eigentliche Arbeitsliste,
            # und sie soll nicht erst auffallen, wenn eine Seite leer bleibt.
            try:
                gelesen, offen = s._conn.execute(
                    "SELECT SUM(ocr_model IS NOT NULL), SUM(status = 'empty') "
                    "FROM council_attachments").fetchone()
                print(f"\nAnlagen per OCR gelesen: {gelesen or 0}   "
                      f"noch als Bild: {offen or 0}")
            except Exception as e:                          # noqa: BLE001
                print(f"\nOCR-Stand nicht lesbar: {e}")

            luecken = s.herkunft_luecken()
            if luecken:
                print("\nZeilen OHNE Herkunft — das darf nicht sein:")
                for tabelle, anzahl in sorted(luecken.items()):
                    print(f"  {tabelle:32} {anzahl}")
            else:
                print("\nKeine Zeile ohne Herkunft.")

            # Die Rücklagenzahl ist keine eigene Tabellenzeile, sondern die
            # belegbare Summe aus Überschussrücklage und noch nicht
            # umgebuchtem Jahresergebnis. Deshalb würde sie in der reinen
            # Tabelleninventur oben nicht auffallen, wenn eine der beiden
            # Rollen beim Parsen fehlt.
            ruecklagen = s.get_ruecklagen()
            print("\nVerfügbare Überschussrücklage nach Jahresergebnis:")
            if ruecklagen:
                for zeile in ruecklagen:
                    print(f"  {zeile['year']}: "
                          f"{zeile['state_after_result'] / 1_000_000:.1f} Mio. Euro")
            else:
                print("  LEER — Bilanzrollen oder Jahresergebnis fehlen")

            # Wer welche Änderung wollte. Auch das sieht die Tabelleninventur
            # nicht: Der Urheber steht in einer SPALTE, nicht in einer eigenen
            # Tabelle — fiele er weg, bliebe die Zeilenzahl gleich. Zu erwarten
            # ist genau ein Jahrgang (2021, 187 Positionen), weil nur dessen
            # Beschluss-Datei eine Spalte „Vorschlag von“ führt. Meldet der
            # Lauf plötzlich mehr, hat entweder das Ratsinformationssystem ein
            # neues Dokument bekommen — oder die Kopferkennung greift zu weit.
            try:
                mit = s._conn.execute(
                    "SELECT budget_year, COUNT(*) FROM council_budget_amendments "
                    "WHERE author IS NOT NULL GROUP BY budget_year "
                    "ORDER BY budget_year").fetchall()
                print("\nÄnderungslisten mit Urheber je Position:")
                for jahrgang, anzahl in mit:
                    print(f"  {jahrgang}: {anzahl} Positionen")
                if not mit:
                    print("  KEINE — erwartet wäre der Jahrgang 2021")
            except Exception as e:                          # noqa: BLE001
                print(f"\nUrheber-Stand nicht lesbar: {e}")
            s.close()
            PY

            # Der aufgehobene Riss aus dem Wirtschaftsplan-Lauf (Begründung
            # oben). Jetzt steht der Bericht da, jetzt darf er den Lauf rot
            # färben — nicht früher.
            if [ "$ocr" -ne 0 ]; then
              echo ""
              echo "Der OCR-Lauf hat Exit $ocr gemeldet. Die häufigste Ursache ist"
              echo "ein fehlender OPENROUTER_API_KEY in der .env der Dev-VM; die"
              echo "zweithäufigste eine Seite, die weder ein eingebettetes Bild"
              echo "trägt noch gerendert werden konnte (dafür bräuchte es pymupdf,"
              echo "bewusst nicht in requirements.txt). Der Wortlaut steht oben."
              echo "Die übrigen Ingests sind trotzdem durchgelaufen."
            fi

            if [ "$wirtschaftsplaene" -ne 0 ]; then
              echo ""
              echo "Der Wirtschaftsplan-Lauf hat Exit $wirtschaftsplaene gemeldet —"
              echo "eine Rechenprobe ist gerissen. Der Wortlaut steht weiter oben,"
              echo "hinter „Probe gerissen — NICHT gespeichert:\"."
              exit "$wirtschaftsplaene"
            fi

            # Der OCR-Lauf färbt ZULETZT rot: Er ist ein Zulieferer, kein
            # Ingest. Ein Ausfall heißt „ein Jahrgang fehlt", nicht „eine Zahl
            # ist falsch" — und der Bestandsbericht oben soll trotzdem lesbar
            # sein, wenn jemand nachschaut, warum.
            if [ "$ocr" -ne 0 ]; then
              exit "$ocr"
            fi
