# Manuell auslösbar: Lottis Satz zur Sitzung für den Bestand nachziehen
# (scripts/sitzungssaetze.py, council/session_summary.py, Schalter
# `sitzung-kurs`). Im Alltag entsteht er in check_committees und
# check_protocols — auf dev laufen keine Crons, dort braucht es diesen Lauf.
#
# Ohne „schreiben“ nennt das Skript nur, wie viele Sitzungen offen sind; mit
# schreibt es. Ein Satz kostet rund 0,0003 $, ein Jahr Bestand (≈120
# Sitzungen) also wenige Cent. Die Kostengrenze (Vorgabe 1 $) hält den Lauf an.
#
# Prod kennt das Skript erst mit dem nächsten Release.
name: "Ops: Lottis Sätze zu Sitzungen"

on:
  workflow_dispatch:
    inputs:
      umgebung:
        description: "Welche VM? (prod = ratslotse.de, dort erst nach dem Release)"
        type: choice
        options: [dev, prod]
        default: dev
      schreiben:
        description: "Wirklich auswerten und speichern (aus = nur zählen)"
        type: boolean
        default: false
      limit:
        description: "Höchstens so viele Sitzungen (leer = alle eines Jahres)"
        type: string
        default: ""
      max_usd:
        description: "Kostengrenze des Laufs in Dollar"
        type: string
        default: "1"

concurrency:
  group: ops-sitzungssaetze-${{ inputs.umgebung }}
  cancel-in-progress: false

jobs:
  saetze:
    runs-on: ubuntu-latest
    steps:
      # Für die SSH-Action aus .github/actions/ssh.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: "Sitzungssätze (${{ inputs.umgebung }})"
        env:
          SCHREIBEN: ${{ inputs.schreiben }}
          LIMIT: ${{ inputs.limit }}
          MAX_USD: ${{ inputs.max_usd }}
        uses: ./.github/actions/ssh
        with:
          host: ${{ inputs.umgebung == 'prod' && secrets.VPS_HOST || secrets.VPS_DEV_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          proxy_host: ${{ secrets.VPS_PROXY_HOST }}
          proxy_username: ${{ secrets.VPS_PROXY_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          proxy_port: ${{ secrets.VPS_SSH_PORT }}
          command_timeout: 60m
          # Eingaben über `envs` und geprüft, nicht als `${{ … }}` im Skripttext.
          envs: SCHREIBEN,LIMIT,MAX_USD
          script: |
            set -e
            cd ~/app
            if [ ! -f scripts/sitzungssaetze.py ]; then
              echo "scripts/sitzungssaetze.py fehlt hier — auf Prod erst nach dem Release."; exit 2
            fi
            case "$LIMIT" in ''|*[!0-9]*) LIMIT=0 ;; esac
            if ! echo "$MAX_USD" | grep -qE '^[0-9]{1,2}(\.[0-9]{1,2})?$'; then
              echo "max_usd muss eine Zahl wie 1 oder 0.5 sein: $MAX_USD"; exit 2
            fi
            PY=.venv/bin/python
            # Die Login-Shell auf dem Server ist zsh: Schalter in einer Variablen
            # würden dort nicht geteilt (s. ops-gold.yml) — deshalb ausgeschrieben.
            if [ "$SCHREIBEN" = "true" ]; then
              $PY scripts/sitzungssaetze.py --schreiben --limit "$LIMIT" --max-usd "$MAX_USD"
            else
              $PY scripts/sitzungssaetze.py --limit "$LIMIT"
            fi
