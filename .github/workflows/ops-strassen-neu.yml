# Manuell auslösbarer Ops-Lauf: Straßen, von denen nur EIN Segment gespeichert
# ist, noch einmal vollständig holen.
#
# WOFÜR. Bis 09/2026 entschied allein ein Namensmuster, ob eine Straße bei
# Overpass (alle Segmente) oder bei Nominatim (das eine Segment, das zufällig
# zuerst passt) geholt wurde. 96 von 570 Straßen fielen durch das Muster —
# „Tweelbäker Tredde", „Am Schmeel", „Babenend", „Huntemannstr". Von ihnen
# steht nur ein Stück in der Datenbank, und damit auch nur ein Teil ihrer
# Ortsbereiche: „Tweelbäker Tredde" lag ganz in Tweelbäke, obwohl 51 von 85
# Stützpunkten der vollen Straße in Krusenbusch liegen. Im
# Einrichtungs-Assistenten stand sie deshalb unter „direkt nebenan", während
# sie mitten durch den eigenen Stadtteil führt (Tims Befund, 03.09.2026).
#
# Neue Orte gehen seit der `kind`-Weiche in `geocode_entities._is_street` von
# vornherein an Overpass. Dieser Lauf repariert nur den Bestand — er ist
# einmalig gedacht und beliebig wiederholbar.
#
# DAUER. 513 Straßen bei ~1 Overpass-Abfrage/Sekunde; gemessen antwortet
# Overpass unter Last in ~25 s, der Lauf braucht also mehrere Stunden. Deshalb
# läuft er auf dem Server mit `nohup` los und der Workflow wartet nicht: Der
# Fortschritt steht in `logs/strassen-neu.log`.
name: "Ops: Straßen vollständig neu holen"

on:
  workflow_dispatch:
    inputs:
      ziel:
        description: "Auf welcher Umgebung"
        type: choice
        options: [dev, prod]
        default: dev
      limit:
        description: "Höchstens so viele Straßen (leer = alle)"
        required: false
        default: ""

concurrency:
  group: ops-strassen-neu
  cancel-in-progress: false

jobs:
  strassen:
    runs-on: ubuntu-latest
    steps:
      - name: Straßen-Geometrien nachholen
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ inputs.ziel == 'prod' && secrets.VPS_HOST || secrets.VPS_DEV_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          proxy_host: ${{ secrets.VPS_PROXY_HOST }}
          proxy_username: ${{ secrets.VPS_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -e
            cd ~/app
            mkdir -p logs
            nohup .venv/bin/python scripts/geocode_decision_locations.py \
              --strassen-neu ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }} \
              >> logs/strassen-neu.log 2>&1 < /dev/null &
            sleep 20
            tail -n 5 logs/strassen-neu.log
            echo "Läuft weiter im Hintergrund — Stand: tail -f ~/app/logs/strassen-neu.log"
