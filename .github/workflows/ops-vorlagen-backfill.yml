# Manuell auslösbarer Ops-Lauf: holt alle fehlenden Vorlagen-Volltexte und
# Anlagen (inkl. Fraktions-Anträge mit Antragsteller-Erkennung) auf dem Server
# nach und baut anschließend den FTS-Index neu. Nutzt denselben
# Deploy-Key/ProxyJump wie deploy.yml — praktisch, wenn lokal kein SSH-Zugang
# verfügbar ist. Nur Collaborator können triggern.
#
# SEIT 09/2026 ZUERST DER SITZUNGS-NACHLAUF. Vorlagen kennt dieser Lauf nur über
# die Tagesordnungen gespeicherter Sitzungen — eine Sitzung, die der Kalender-
# lauf verpasst hat, trägt ihre Vorlagen nie herein. Am 23.09.2026 fehlten so
# 48 öffentliche Sitzungen seit 2018 (`scripts/nachlauf_sitzungen.py`).
# `seit` steuert, wie weit er zurückgeht; `protokolle` holt für die
# nachgetragenen Sitzungen auch die Beschlüsse (LLM, Kosten stehen im Log).
name: "Ops: Vorlagen-Backfill"

on:
  workflow_dispatch:
    inputs:
      seit:
        description: "Sitzungs-Nachlauf ab Monat (JJJJ-MM)"
        type: string
        required: true
        default: "2024-01"
      protokolle:
        description: "Protokolle der Sitzungen ab diesem Monat nachziehen (LLM)?"
        type: boolean
        default: false

concurrency:
  group: ops-vorlagen-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Run backfill + FTS rebuild on server
        env:
          SEIT: ${{ inputs.seit }}
          PROTOKOLLE: ${{ inputs.protokolle }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          proxy_host: ${{ secrets.VPS_PROXY_HOST }}
          proxy_username: ${{ secrets.VPS_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_port: ${{ secrets.VPS_SSH_PORT }}
          # Der volle Erstlauf über ~5.000 Vorlagen dauert deutlich länger als
          # die 10-Minuten-Default-Grenze der Action.
          command_timeout: 120m
          # Die Eingaben gehen über `envs` an die Shell und NICHT als
          # `${{ … }}` in den Skripttext — ein interpolierter Wert ist eine
          # Kommandozeile (wie in ops-anlagen-ocr.yml). `seit` wird zusätzlich
          # auf JJJJ-MM geprüft, bevor es ein Argument wird.
          envs: SEIT,PROTOKOLLE
          script: |
            set -e
            cd ~/app
            if ! echo "$SEIT" | grep -qE '^[0-9]{4}-[0-9]{2}$'; then
              echo "seit muss JJJJ-MM sein, war: $SEIT"; exit 2
            fi
            .venv/bin/python scripts/nachlauf_sitzungen.py --seit "$SEIT"
            if [ "$PROTOKOLLE" = "true" ]; then
              .venv/bin/python scripts/backfill_protocols.py --since "${SEIT}-01" --workers 4
            fi
            .venv/bin/python scripts/backfill_vorlagen.py
            .venv/bin/python scripts/backfill_anlagen.py
            # Tabellennamen seit dem Englisch-Umbau (#918): council_templates,
            # council_attachments, is_motion — die alten Namen ließen diesen
            # Schluss mit „no such table" scheitern, nachdem alles getan war.
            .venv/bin/python - <<'PY'
            from council.store import CouncilStore
            s = CouncilStore("data/council.sqlite")
            n = s.rebuild_fts()
            counts = dict(s._conn.execute(
                "SELECT status, COUNT(*) FROM council_templates GROUP BY status").fetchall())
            anl = dict(s._conn.execute(
                "SELECT is_motion, COUNT(*) FROM council_attachments GROUP BY is_motion").fetchall())
            stats = s.antrag_stats()
            print(f"FTS neu aufgebaut: {n} Beschlüsse indexiert · Vorlagen-Status: {counts}")
            print(f"Anlagen: {anl} · Anträge mit Beschluss: {stats['n_mit_beschluss']}/{stats['n_antraege']}")
            s.close()
            PY
