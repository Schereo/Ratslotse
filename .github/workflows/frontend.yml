name: Frontend

# Prüft das Next-Frontend bei jedem PR, der es anfasst.
#
# WARUM ES DAS GIBT (20.08.2026): Bis dahin baute die CI ausschließlich die
# Starlight-Doku (`docs.yml`, dort heißt der Job ebenfalls „build" — daher die
# Verwechslungsgefahr). Das Frontend wurde erst BEIM DEPLOY übersetzt, auf der
# Dev- bzw. Prod-VM. Ein Tippfehler in einer .tsx kam also garantiert durch die
# PR-Prüfung und riss danach den Deploy.
#
# Genau das ist an diesem Tag passiert: In einem deutschen Zitat innerhalb
# eines String-Literals stand als schließendes Zeichen ein gerades `"` statt
# `“`. Das beendet das Literal — „Unterminated string constant", der Dev-Deploy
# brach ab, und der PR war zu dem Zeitpunkt längst grün und gemergt.
#
# `tsc --noEmit` fängt genau diese Klasse (TS1002/TS1005) und dazu jeden
# Typfehler. Der volle `next build` liefe zusätzlich Minuten lang für Bundling
# und Optimierung, das der Deploy ohnehin macht — die Prüfung, die hier fehlt,
# ist die des Übersetzers, nicht die des Bundlers.

on:
  push:
    branches: [main]
    paths:
      - 'web/frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'web/frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      # `npm ci` statt `npm install`: reproduzierbar aus dem Lockfile, und der
      # `postinstall`-Schritt (patch-package) läuft mit — ohne ihn fehlten die
      # Patches, die das Repo an Abhängigkeiten fährt.
      - run: npm ci

      - name: TypeScript übersetzen (ohne Ausgabe)
        run: npx tsc --noEmit

      # Die Logik-Tests aus `lib/` (vitest). Bis 09/2026 gab es hier GAR
      # KEINE: 94.000 Zeilen Frontend gegen 23 Browsertests, und die brauchen
      # zwei Server und zwei Minuten. Was sie strukturell nicht erreichen, ist
      # der Grenzfall in einer reinen Funktion — „16:29 gegen 16:30" im
      # Live-Fenster lässt sich in einem Browsertest nicht herstellen, ohne die
      # Systemuhr zu stellen. Der Lauf kostet unter einer Sekunde.
      - name: Logik-Tests (vitest)
        run: npx vitest run

      # ESLint, bewusst auf EINE Klasse eingestellt — dieselbe Überlegung wie
      # bei ruff („nur F", s. `ruff.toml`). Gemessen am 02.09.2026 auf dem
      # Bestand:
      #
      #     next/core-web-vitals, unverändert  →  ~40 Fehler
      #     davon `react/no-unescaped-entities`   fast alle
      #
      # Diese Regel meldet das typografische Anführungszeichen in deutschem
      # JSX-Text. Sie einzuschalten hieße, den Bestand umzuschreiben, und sie
      # hat noch nie einen Fehler gefunden. Sie ist aus.
      #
      # Scharf sind die beiden Hook-Regeln. `rules-of-hooks` findet eine
      # Klasse, die zur Laufzeit als „Rendered fewer hooks than expected"
      # abstürzt und die der Übersetzer nicht sieht; sie steht auf Fehler und
      # hat heute null Funde, ist also ohne Umbau einschaltbar.
      # `exhaustive-deps` steht auf Hinweis: Die 11 Funde im Bestand sind zum
      # Teil bewusst so, das zu entscheiden ist Handarbeit und gehört nicht in
      # denselben Schritt wie das Einschalten.
      - name: ESLint (Hook-Regeln)
        run: npx next lint

      # Rechnet die Skalen-Regeln des Grafik-Baukastens nach. Der Übersetzer
      # oben kann das nicht: Eine Achse, die jeden Wert der Reihe aus dem Bild
      # schiebt, ist typkorrekt. Node liest die `.ts` direkt (Type-Stripping),
      # die Probe prüft also das echte Modul und keine Kopie seiner Regeln.
      - name: Skalen des Grafik-Baukastens nachrechnen
        run: node --experimental-strip-types scripts/pruefe-skala.mjs

      # Dieselbe Sorte Fehler eine Ebene weiter: Ein Posten von 1,8 Mio. €
      # bekam eine Kachel von 100 × 5 px. Die Zahl stimmte, die Fläche stimmte —
      # zu sehen war ein Strich.
      - name: Geometrie der Kachelfläche nachrechnen
        run: node --experimental-strip-types scripts/pruefe-kachelflaeche.mjs
