class Component extends DCLogic {
componentDidMount() {
if (super.componentDidMount) super.componentDidMount();
const el = this.wurzel && this.wurzel.current;
if (!el || typeof ResizeObserver === 'undefined') return;
this.beobachter = new ResizeObserver(() => {
const neu = el.offsetWidth || 0;
const alt = (this.state && this.state.breite) || 0;
if (neu > 0 && Math.abs(neu - alt) > 1) this.setState({ breite: neu });
});
this.beobachter.observe(el);
}
componentWillUnmount() {
if (this.beobachter) this.beobachter.disconnect();
if (super.componentWillUnmount) super.componentWillUnmount();
}
renderVals() {
if (!this.wurzel) this.wurzel = { current: null };
try {
return this.rechne();
} catch (e) {
return { wurzel: this.wurzel, reihen: [], fehler: true };
}
}

{ nr: 'Ö 9.1', titel: 'Teilflächennutzungsplan Windenergie', icon: 'wind', wichtig: true },
{ nr: 'Ö 9.2', titel: 'Änderung 84 des Flächennutzungsplans', icon: 'karte' },
{ nr: 'Ö 9.3', titel: 'Bebauungsplan 837', icon: 'karte' },

] },
{ name: 'Anträge', kurz: 'Anträge', punkte: [
{ nr: 'Ö 10.1', titel: 'P+R-Standorte aufwerten und bewerben (SPD)', icon: 'parken' },
{ nr: 'Ö 10.2', titel: 'Verkehrsführung Herbartstraße / Cäcilienplatz (Grüne, Ratsherr Lükermann)', icon: 'schild' },
{ nr: 'Ö 10.3', titel: 'Grundsteuer C (BSW)', icon: 'euro', wichtig: true },
{ nr: 'Ö 10.4', titel: 'Abstimmungsverhalten im Ratsinfo dokumentieren (Gruppe für Oldenburg)', icon: 'liste' },
{ nr: 'Ö 10.5', titel: 'PAK-Belastung in der Flugplatzbäke (Gruppe für Oldenburg)', icon: 'labor' },
{ nr: 'Ö 10.6', titel: 'Abfallentsorgung Fliegerhorst (CDU)', icon: 'muell' },
{ nr: 'Ö 10.7', titel: 'Ratsbeschlüsse zum Fliegerhorst (FDP)', icon: 'flugzeug' }
] },
{ name: 'Zum Schluss', kurz: 'Schluss', punkte: [
{ nr: 'Ö 11', titel: 'Anfragen und Anregungen', icon: 'fragen' }
] },
{ name: 'Nichtöffentlich', kurz: '', gesperrt: true, nr: 'N 12–15', titel: 'Nichtöffentlicher Teil · 5 Punkte', kurzTitel: '5 Punkte' }
] }
};
}
rechne() {
const p = this.props || {};
const s = this.state || {};
const alle = this.sitzungen();
const sitzung = alle[p.sitzung] || alle.normal;
const sym = this.symbole();
const vorgabe = Number(p.breite) || 0;
const breite = vorgabe > 0 ? vorgabe : (s.breite > 0 ? s.breite : 1176);
const LINIE = '2px solid hsla(205, 92%, 34%, 0.3)';
const STRICH = '2px dashed hsla(205, 92%, 34%, 0.3)';
const KEINE = '2px solid transparent';
const FEST = '2px solid hsl(205, 92%, 34%)';
const GRAU = { ring: 'hsla(207, 18%, 38.5%, 0.5)', voll: 'hsl(207, 18%, 38.5%)', schein: 'hsla(207, 18%, 38.5%, 0.16)' };
const FARBEN = {
angenommen: { ring: '#22c55e', voll: '#15803d', schein: 'rgba(34, 197, 94, 0.22)' },
kenntnis: { ring: '#3b82f6', voll: '#1d4ed8', schein: 'rgba(59, 130, 246, 0.22)' },
vertagt: { ring: '#f59e0b', voll: '#b45309', schein: 'rgba(245, 158, 11, 0.25)' },
abgelehnt: { ring: '#ef4444', voll: '#b91c1c', schein: 'rgba(239, 68, 68, 0.22)' },
erledigt: GRAU,
kein: GRAU
};
const WORT = { angenommen: 'Angenommen', kenntnis: 'Zur Kenntnis', vertagt: 'Vertagt', abgelehnt: 'Abgelehnt', erledigt: 'Erledigt', kein: 'Kein Beschluss' };
const waehle = typeof p.onWaehle === 'function' ? p.onWaehle : null;
const eigene = (p.ergebnisse && typeof p.ergebnisse === 'object') ? p.ergebnisse : {};

const phasen = sitzung.phasen;
const zellen = [{ art: 'start', phase: -1, nr: sitzung.start, titel: 'Beginn ' + sitzung.start + ' Uhr' }];
phasen.forEach((ph, pi) => {
let liste;
if (ph.gesperrt === true) {
liste = [{ art: 'schloss', nr: ph.nr, titel: ph.titel, kurz: ph.kurzTitel }];
} else {
liste = ph.punkte.map((x) => {
const erg = x.ergebnis || eigene[x.nr] || '';
return {
art: x.wichtig === true ? 'wichtig' : 'boje',
nr: x.nr,
titel: x.nr + ' · ' + x.titel + (erg && WORT[erg] ? ' · ' + WORT[erg] : ''),
kurz: x.kurz || x.titel,
ergebnis: erg,
icon: x.icon,
vertagt: x.vertagt === true,
href: x.href || '#'
};
});
}
const anzahl = liste.length;
if (liste.length < 2) {
if (pi === phasen.length - 1) liste.unshift({ art: 'leer' });
else liste.push({ art: 'leer' });
}
liste.forEach((z) => {
z.phase = pi;
z.gesperrt = ph.gesperrt === true;
z.phasenName = ph.name;
z.phasenKurz = ph.kurz !== undefined ? ph.kurz : ph.name;
z.phasenMittel = ph.mittel || '';
z.anzahl = anzahl;
zellen.push(z);
});
});

const n = zellen.length;
let letzteOeffentliche = 0;
zellen.forEach((z, i) => {
if (z.art === 'boje' || z.art === 'wichtig') letzteOeffentliche = i;
});
const aktivNr = String(p.aktiv || '');
let aktivIndex = -1;
if (aktivNr) {
zellen.forEach((z, i) => {
if (z.nr === aktivNr) aktivIndex = i;
});
}

const nutz = Math.max(120, breite - 36);
const passen = (min) => Math.max(3, Math.floor(nutz / min));
let dichte = (p.dichte === 'komfortabel' || p.dichte === 'kompakt') ? p.dichte : 'auto';
let spalten = passen(60);
if (dichte === 'auto') dichte = Math.ceil(n / spalten) > 2 ? 'kompakt' : 'komfortabel';
const kompakt = dichte === 'kompakt';
if (kompakt) spalten = passen(30);
const zeilen = Math.max(1, Math.ceil(n / spalten));
spalten = Math.ceil(n / zeilen);
const zellenBreite = nutz / spalten;
const zeigKurz = !kompakt && zeilen === 1 && zellenBreite >= 104;
const KOPF = kompakt ? 18 : 20;
const KNOTEN = kompakt ? 30 : 44;
const FUSS = kompakt ? 18 : (zeigKurz ? 40 : 22);
const hoehe = KOPF + KNOTEN + FUSS;

const etikettBei = {};
phasen.forEach((ph, pi) => {
const teile = [];
zellen.forEach((z, i) => {
if (z.phase !== pi) return;
const r = Math.floor(i / spalten);
const letztes = teile[teile.length - 1];
if (letztes && letztes.r === r) letztes.laenge += 1;
else teile.push({ r: r, erste: i, laenge: 1 });
});
if (!teile.length) return;
let wahl = teile[0];
for (let k = 0; k < teile.length; k++) {
if (teile[k].laenge >= 2) { wahl = teile[k]; break; }
}
etikettBei[wahl.erste] = wahl.laenge;
});

const fertig = zellen.map((z, i) => {
const r = Math.floor(i / spalten);
const rueck = r % 2 === 1;
const vorher = i > 0 ? zellen[i - 1] : null;
const nachher = i < n - 1 ? zellen[i + 1] : null;
const anfang = !vorher || vorher.phase !== z.phase;
const ende = !nachher || nachher.phase !== z.phase;
const inBand = z.phase >= 0;
const spaltEin = anfang ? 3 : 0;
const spaltAus = ende ? 3 : 0;
const rundEin = anfang ? 12 : 0;
const rundAus = ende ? 12 : 0;
const radL = rueck ? rundAus : rundEin;
const radR = rueck ? rundEin : rundAus;
const wichtig = z.art === 'wichtig';
const kreis = wichtig ? (kompakt ? 26 : 40) : (kompakt ? 22 : 30);
const laenge = etikettBei[i] || 0;
const name = z.phasenName || '';
const voll = z.anzahl > 1 ? name + ' · ' + z.anzahl : name;
const abzug = kompakt ? 12 : 20;
const platz = Math.max(1, laenge) * zellenBreite - abzug;
const passt = (text) => text.length * 7.1 <= platz;
let etikett = z.phasenKurz || '';
if (!kompakt) {
if (passt(voll)) etikett = voll;
else if (passt(name)) etikett = name;
else if (z.phasenMittel && passt(z.phasenMittel)) etikett = z.phasenMittel;
}
const hervor = wichtig || z.art === 'start' || i === aktivIndex;
const farbe = z.ergebnis ? (FARBEN[z.ergebnis] || GRAU) : null;
const nummer = z.nr;
return {
richtung: rueck ? 'row-reverse' : 'row',
kopf: KOPF,
knoten: KNOTEN,
vor: i === 0 ? KEINE : (aktivIndex >= 0 && i <= aktivIndex ? FEST : (i > letzteOeffentliche ? STRICH : LINIE)),
nach: i === n - 1 ? KEINE : (aktivIndex >= 0 && i < aktivIndex ? FEST : (i >= letzteOeffentliche ? STRICH : LINIE)),
rahmen: farbe ? '2px solid ' + farbe.ring : '1px solid hsl(206, 38%, 82%)',
fuellung: farbe ? farbe.voll : 'hsl(205, 92%, 34%)',
schein: farbe ? farbe.schein : 'hsla(205, 92%, 34%, 0.16)',
punktFarbe: farbe ? farbe.ring : 'hsla(205, 92%, 34%, 0.55)',
deckkraft: (aktivIndex >= 0 && i < aktivIndex) ? 0.55 : 1,
marke: i === aktivIndex ? 'outline: 3px solid hsl(19, 92%, 50%); outline-offset: 2px' : 'outline: none',
klick: (waehle && nummer) ? ((e) => { if (e && e.preventDefault) e.preventDefault(); waehle(nummer); }) : undefined,
band: !inBand ? 'transparent' : (z.gesperrt ? 'hsla(0, 0%, 100%, 0.3)' : 'hsla(0, 0%, 100%, 0.62)'),
bandLinks: rueck ? spaltAus : spaltEin,
bandRechts: rueck ? spaltEin : spaltAus,
bandRadius: radL + 'px ' + radR + 'px ' + radR + 'px ' + radL + 'px',
hatEtikett: laenge > 0 && etikett.length > 0,
etikett: etikett,
etikettZellen: Math.max(1, laenge),
etikettLage: (rueck ? 'right: ' : 'left: ') + (abzug / 2) + 'px; text-align: ' + (rueck ? 'right' : 'left'),
etikettAbzug: abzug,
etikettGroesse: kompakt ? 9.5 : 10.5,
ring: kompakt ? 3 : 4,
istStart: z.art === 'start',
istBoje: z.art === 'boje' && (!kompakt || i === aktivIndex),
istPunkt: z.art === 'boje' && kompakt && i !== aktivIndex,
istWichtig: wichtig,
istSchloss: z.art === 'schloss',
kreis: kreis,
symbol: wichtig ? (kompakt ? 14 : 18) : (kompakt ? 12 : 15),
rand: -Math.round((44 - kreis) / 2),
d: sym[z.icon] || sym.dokument,
vertagt: z.vertagt === true ? 'block' : 'none',
hatNummer: z.art !== 'leer' && (!kompakt || z.art !== 'boje' || anfang || i === aktivIndex),
nr: kompakt ? String(z.nr || '').replace('Ö ', '') : (z.nr || ''),
nrGroesse: kompakt ? 9.5 : 10.5,
nrStil: hervor ? 'font-weight: 700; color: hsl(212, 55%, 11%)' : 'font-weight: 500; color: hsl(207, 18%, 38.5%)',
hatKurz: zeigKurz && z.art !== 'leer' && z.art !== 'start',
kurz: z.kurz || '',
href: z.href || '#',
titel: z.titel || ''
};
});

const reihen = [];
for (let r = 0; r < zeilen; r++) {
const rueck = r % 2 === 1;
const richtung = rueck ? 'row-reverse' : 'row';
const stueck = fertig.slice(r * spalten, (r + 1) * spalten);
const endZelle = stueck[stueck.length - 1];
while (stueck.length < spalten) {
stueck.push({
richtung: richtung, kopf: KOPF, knoten: KNOTEN, vor: KEINE, nach: KEINE,
band: 'transparent', bandLinks: 0, bandRechts: 0, bandRadius: '0px',
hatEtikett: false, istStart: false, istBoje: false, istPunkt: false, istWichtig: false, istSchloss: false,
hatNummer: false, hatKurz: false
});
}
reihen.push({
richtung: richtung,
hoehe: hoehe,
maxBreite: zeilen === 1 ? (spalten * 150 + 36) + 'px' : 'none',
zellen: stueck,
hatKehre: r < zeilen - 1,
kehreLinie: endZelle ? endZelle.nach : LINIE,
kehreLage: rueck ? 'left: 0; border-right: 0; border-radius: 14px 0 0 14px' : 'right: 0; border-left: 0; border-radius: 0 14px 14px 0',
kehreOben: KOPF + KNOTEN / 2 - 1,
kehreHoehe: hoehe + 10
});
}
return { wurzel: this.wurzel, reihen: reihen, fehler: false };
}
